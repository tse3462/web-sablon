<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BONELİA AI">
<meta name="theme-color" content="#07090d">
<title>BONELİA AI Kontrol Paneli</title>
<style>
:root{--bg:#07090d;--panel:#121820;--panel2:#18202b;--ink:#eef2f7;--muted:#8b97a8;--line:#222b37;--brand:#3d8bff;
 --ok:#33c26f;--warn:#f0b429;--crit:#ff5a5f;--chip:#1c2430;--accent:var(--brand)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;padding:calc(env(safe-area-inset-top) + 12px) 18px 22px;text-align:center;
 background:
  radial-gradient(1.4px 1.4px at 9% 14%,#ffffffb0 50%,transparent 52%),radial-gradient(1px 1px at 21% 38%,#ffffff80 50%,transparent 52%),
  radial-gradient(1.2px 1.2px at 34% 9%,#ffffff99 50%,transparent 52%),radial-gradient(1px 1px at 47% 27%,#ffffff70 50%,transparent 52%),
  radial-gradient(1.5px 1.5px at 63% 16%,#ffffffb0 50%,transparent 52%),radial-gradient(1px 1px at 76% 33%,#ffffff80 50%,transparent 52%),
  radial-gradient(1.2px 1.2px at 88% 11%,#ffffff99 50%,transparent 52%),radial-gradient(1px 1px at 93% 41%,#ffffff60 50%,transparent 52%),
  radial-gradient(1px 1px at 4% 46%,#ffffff60 50%,transparent 52%),radial-gradient(1.2px 1.2px at 55% 44%,#ffffff70 50%,transparent 52%),
  radial-gradient(90% 60% at 50% 100%,color-mix(in srgb,var(--accent) 26%,transparent) 0%,transparent 70%),
  linear-gradient(180deg,#0b1a33 0%,#0a1322 52%,var(--bg) 100%)}
.hero.s-ok{--accent:var(--ok)}.hero.s-warn{--accent:var(--warn)}.hero.s-crit{--accent:var(--crit)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:2}
.topbar .title{font-weight:700;font-size:17px;letter-spacing:.2px;white-space:nowrap}
.topbar .title span{color:var(--brand)}
.iconbtn{position:relative;background:none;border:0;padding:6px;color:var(--ink);width:40px}
.iconbtn svg{width:26px;height:26px}
.badge{position:absolute;top:0;right:2px;background:var(--crit);color:#fff;border-radius:10px;font-size:11px;font-weight:700;min-width:18px;height:18px;line-height:18px;padding:0 5px}
.tools{display:flex;gap:6px;align-items:center;justify-content:flex-end;min-width:40px}
select{background:#ffffff14;color:var(--ink);border:1px solid #ffffff22;border-radius:8px;padding:5px 6px;font:inherit;font-size:13px}
select option{background:var(--panel);color:var(--ink)}
.updated{margin-top:14px;font-size:14px;color:#c8d3e3cc}
.headline{margin:4px 0 0;padding-top:.12em;font-weight:900;font-size:clamp(46px,15vw,104px);line-height:.98;letter-spacing:-1.5px;
 background:linear-gradient(180deg,#fff 30%,#c4d2e8);-webkit-background-clip:text;background-clip:text;color:transparent}
.emblem{position:relative;width:150px;height:150px;margin:18px auto 6px}
.ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--accent) 55%,transparent)}
.ring.r2{inset:22px;border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.ring.r1{animation:pulse 3.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.82);opacity:.9}100%{transform:scale(1.12);opacity:0}}
.core{position:absolute;inset:44px;border-radius:50%;display:grid;place-items:center;color:#fff;
 background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--accent) 85%,#fff),var(--accent));
 box-shadow:0 0 40px color-mix(in srgb,var(--accent) 60%,transparent),0 0 90px color-mix(in srgb,var(--accent) 30%,transparent)}
.core svg{width:34px;height:34px}
.subline{color:#c8d3e3;font-size:14px;max-width:520px;margin:6px auto 0}
.hero.compact .big{display:none}.big.tap{cursor:pointer}
.hero.compact{padding-bottom:14px}

/* ---------- navigation ---------- */
nav{display:flex;justify-content:center;gap:4px;padding:8px 12px;position:sticky;top:0;z-index:20;background:#07090dee;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav button{background:none;border:0;color:var(--muted);display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;position:relative}
nav button svg{width:20px;height:20px}
nav button.active{color:var(--ink);background:var(--chip);font-weight:600}
@media (max-width:820px){
 nav{position:fixed;top:auto;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(6,1fr);gap:0;padding:6px 2px calc(env(safe-area-inset-bottom) + 4px);border-top:1px solid var(--line);border-bottom:0}
 nav button{flex-direction:column;gap:3px;font-size:10px;padding:6px 0;border-radius:0}
 nav button svg{width:24px;height:24px}
 nav button.active{background:none}
 nav button.active::after{content:"";position:absolute;bottom:-2px;left:30%;right:30%;height:3px;border-radius:2px;background:var(--ink)}
 main{padding-bottom:calc(92px + env(safe-area-inset-bottom))!important}
}

/* ---------- content ---------- */
main{max-width:1100px;margin:0 auto;padding:16px 14px 40px}
h2{font-size:20px;margin:22px 4px 12px;font-weight:700}
.ph{margin-top:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (min-width:821px){.tiles{grid-template-columns:repeat(4,1fr)}.tile.wide{grid-column:span 2}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;min-height:120px;text-align:left;display:flex;flex-direction:column;position:relative;transition:transform .12s}
.tile:active{transform:scale(.98)}
.tile.wide{grid-column:span 2}
.tt{font-weight:700;font-size:16px}
.tv{color:var(--muted);font-size:14px;margin-top:1px}
.tfoot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;padding-top:14px}
.tfoot svg{width:28px;height:28px;color:var(--ink);opacity:.9}
.tbig{font-size:34px;font-weight:800;line-height:1}
.tbig small{font-size:15px;font-weight:600;color:var(--muted);margin-left:3px}
.tile.s-ok .tbig{color:var(--ok)}.tile.s-warn .tbig{color:var(--warn)}.tile.s-crit .tbig{color:var(--crit)}
.block{margin-top:6px}
.bh{display:flex;align-items:center;justify-content:space-between}
.link{background:none;border:0;color:var(--brand);font-weight:600;padding:8px 4px}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 8px 12px;position:relative;min-height:116px;text-align:center}
.app .ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:28px;background:linear-gradient(145deg,#25324a,#141b26);box-shadow:inset 0 1px 0 #ffffff14}
.app .an{font-size:13px;font-weight:600;line-height:1.2;word-break:break-word}
.app .ah{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app.add{border-style:dashed;color:var(--muted);background:transparent;justify-content:center;font:inherit}
.app.add .ic{background:var(--chip);font-size:26px;color:var(--ink)}
.app .ed{display:none;gap:4px;margin-top:4px}
.editing .app .ed{display:flex}
.editing a.app{pointer-events:none}.editing a.app .ed{pointer-events:auto}
.ed button{background:var(--chip);border:0;border-radius:8px;padding:3px 7px;font-size:13px}
.hint{color:var(--muted);font-size:13px;margin:10px 4px 0}
.item{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.ih{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meta{color:var(--muted);font-size:13px;margin-top:4px;word-break:break-word}
.tiny{font-size:11px;opacity:.7}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{background:var(--chip);color:var(--muted);font-size:12px;border-radius:20px;padding:2px 9px}
.btn{background:var(--brand);color:#fff;border:0;padding:10px 16px;border-radius:10px;font-weight:600}
.sec{background:var(--chip);color:var(--ink);border:0;padding:9px 14px;border-radius:10px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}.off{background:var(--crit)}.na{background:var(--muted)}
.tri{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;color:#fff}.important{background:var(--crit)}.check{background:var(--warn);color:#111}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--crit);font-weight:600}.small{font-size:13px;color:var(--muted)}
.ev{font-size:12px;background:var(--chip);border-radius:8px;padding:6px 9px;margin:8px 0;word-break:break-word}
.conf{font-size:11px;padding:1px 7px;border-radius:10px;background:var(--chip);margin-right:6px}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 4px 12px;color:var(--muted);font-size:14px}
input[type=text],input[type=url]{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px;width:100%;font:inherit;margin:6px 0 12px}
label.f{display:block;font-size:13px;color:var(--muted);margin-top:4px}
ol{padding-left:20px}
.list a{color:var(--ink)}
/* ---------- bottom sheet (app editor) ---------- */
.sheet{position:fixed;inset:0;z-index:50;background:#000a;display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:560px;padding:20px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:92vh;overflow:auto}
@media (min-width:821px){.sheet{align-items:center}.sheet-card{border-radius:22px}}
.sheet-card h3{margin:0 0 10px;font-size:18px}
.icons{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:6px 0 14px}
.icons button{background:var(--chip);border:2px solid transparent;border-radius:10px;font-size:22px;padding:6px 0}
.icons button.sel{border-color:var(--brand)}
.sheet-actions{display:flex;gap:10px;justify-content:flex-end}
</style>
</head>
<body>
<header class="hero" id="hero">
  <div class="topbar">
    <button class="iconbtn" id="bell" aria-label="!"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="badge hidden" id="bellN"></span></button>
    <div class="title">BONELİA <span>AI</span> <span data-i="platform" style="color:inherit;font-weight:500"></span></div>
    <div class="tools"><select id="lang"><option value="tr">TR</option><option value="de">DE</option></select><button class="sec" id="quit" data-i="quit" style="padding:5px 9px;font-size:13px"></button></div>
  </div>
  <div class="big">
    <div class="updated" id="updated">&nbsp;</div>
    <h1 class="headline" id="headline">&nbsp;</h1>
    <div class="emblem"><div class="ring r1"></div><div class="ring r2"></div><div class="core" id="core"></div></div>
    <div class="subline" id="subline"></div>
  </div>
</header>

<nav id="nav">
  <button data-p="home" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-i="n_home"></span></button>
  <button data-p="devices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span data-i="n_devices"></span></button>
  <button data-p="findings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.5v.01"/></svg><span data-i="n_findings"></span></button>
  <button data-p="repairs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg><span data-i="n_repairs"></span></button>
  <button data-p="customers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg><span data-i="n_customers"></span></button>
  <button data-p="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg><span data-i="n_settings"></span></button>
</nav>

<main>
  <section id="p-home">
    <div class="tiles">
      <button class="tile wide" data-go="findings" id="tileStatus"><div class="tt" data-i="t_status"></div><div class="tv" id="tStatus">–</div>
        <div class="tfoot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg><div class="tbig" id="kImp">–</div></div></button>
      <button class="tile" data-go="devices" id="tileDev"><div class="tt" data-i="n_devices"></div><div class="tv" data-i="t_online"></div>
        <div class="tfoot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><div class="tbig" id="kOnline">–</div></div></button>
      <button class="tile" data-go="repairs"><div class="tt" data-i="n_repairs"></div><div class="tv" data-i="t_7d"></div>
        <div class="tfoot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg><div class="tbig" id="kRep">–</div></div></button>
      <button class="tile" data-go="settings"><div class="tt" data-i="t_notify"></div><div class="tv" id="tTg">–</div>
        <div class="tfoot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><div class="tbig" id="kTg"></div></div></button>
      <button class="tile" data-go="customers"><div class="tt" data-i="n_customers"></div><div class="tv" data-i="t_level"></div>
        <div class="tfoot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg><div class="tbig" id="kCust">–</div></div></button>
    </div>

    <div class="block">
      <div class="bh"><h2 data-i="my_apps"></h2><button class="link" id="appsEdit" data-i="edit"></button></div>
      <div class="apps" id="apps"></div>
      <p class="hint" data-i="apps_hint"></p>
    </div>

    <div class="block"><h2 data-i="latest"></h2><div id="homeList"></div></div>
  </section>

  <section id="p-devices" class="hidden"><h2 class="ph" data-i="n_devices"></h2><div id="devs"></div></section>
  <section id="p-findings" class="hidden"><h2 class="ph" data-i="n_findings"></h2>
    <div class="filters"><label><input type="checkbox" id="allF"> <span data-i="show_check"></span></label>
      <select id="hoursF"><option value="24">24 h</option><option value="168">7 d</option><option value="720">30 d</option></select></div>
    <div id="finds"></div>
  </section>
  <section id="p-repairs" class="hidden"><h2 class="ph" data-i="n_repairs"></h2><div id="reps"></div></section>
  <section id="p-customers" class="hidden"><h2 class="ph" data-i="n_customers"></h2><div id="custs"></div><p class="hint" data-i="level_help"></p></section>
  <section id="p-settings" class="hidden"><h2 class="ph" data-i="n_settings"></h2>
    <div class="item"><div class="ih"><b data-i="tg_title"></b></div>
      <div id="tgState" style="margin-top:6px"></div>
      <p class="small" data-i="tg_help"></p>
      <div id="tgOff"><ol class="small"><li data-i="tg_s1"></li><li data-i="tg_s2"></li></ol>
        <input id="tgToken" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="123456789:AA...">
        <button class="btn" id="tgSave" data-i="tg_save"></button></div>
      <div id="tgPending" class="hidden"><p id="tgPendingTxt"></p><button class="btn" id="tgConnect" data-i="tg_connect"></button></div>
      <div id="tgOn" class="hidden acts"><button class="btn" id="tgTest" data-i="tg_test"></button><button class="sec" id="tgOffBtn" data-i="tg_off"></button></div>
      <div id="tgMsg" class="small" style="margin-top:10px"></div>
    </div>
  </section>
</main>

<div class="sheet hidden" id="sheet">
  <div class="sheet-card">
    <h3 id="sheetTitle"></h3>
    <label class="f" data-i="app_name"></label><input id="appName" type="text" maxlength="40" autocomplete="off">
    <label class="f" data-i="app_url"></label><input id="appUrl" type="url" inputmode="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://…">
    <label class="f" data-i="app_icon"></label><div class="icons" id="iconPick"></div>
    <div class="sheet-actions"><button class="sec" id="appCancel" data-i="cancel"></button><button class="btn" id="appSave" data-i="tg_save"></button></div>
    <div id="appMsg" class="small bad" style="margin-top:10px"></div>
  </div>
</div>

<script>
const T={tr:{panel:"Kontrol Paneli",platform:"Platformu",n_home:"Ana sayfa",n_devices:"Bilgisayarlar",n_findings:"Sorunlar",n_repairs:"Onarımlar",n_customers:"Müşteriler",n_settings:"Ayarlar",quit:"Kapat",
h_ok:"HER ŞEY<br>TAMAM",h_issue1:"1 ÖNEMLİ<br>SORUN",h_issue:"{n} ÖNEMLİ<br>SORUN",h_off:"{n} BİLGİSAYAR<br>SESSİZ",h_empty:"HENÜZ<br>BİLGİSAYAR YOK",
s_ok:"{on} / {all} bilgisayar çevrimiçi · son 24 saatte önemli sorun yok",s_issue:"Son 24 saatte {n} önemli sorun — görmek için dokun",
s_off:"{n} bilgisayar 15 dakikadır sinyal vermiyor",s_empty:"İlk bilgisayarı USB ile kur",updated:"Bilgisayarlardan güncellendi {t}",
t_status:"Durum",st_ok:"Her şey tamam",st_issue:"{n} önemli sorun",st_off:"{n} bilgisayar sessiz",st_empty:"Bilgisayar yok",
t_online:"çevrimiçi",t_7d:"son 7 gün",t_notify:"Bildirimler",t_level:"müşteri",
my_apps:"Uygulamalarım",edit:"Düzenle",done:"Bitti",add:"Ekle",app_add:"Uygulama ekle",app_edit:"Uygulamayı düzenle",app_name:"Ad",app_url:"Adres (https://…)",app_icon:"Simge",cancel:"Vazgeç",
apps_hint:"Programlarının ve admin panellerinin adreslerini ekle; tek dokunuşla açılır. Şifre burada tutulmaz — giriş her programın kendi sayfasında yapılır (telefonun şifreyi hatırlar).",
app_del_q:"Bu uygulama listeden kaldırılsın mı?",err_invalid_url:"Adres https:// veya http:// ile başlamalı (ör. https://admin.ornek.de).",err_too_many_apps:"En fazla 40 uygulama.",
k_customers:"Müşteri",latest:"Son önemli sorunlar",
c_device:"Bilgisayar / USB",c_customer:"Müşteri",c_kind:"Tür",c_seen:"Son görülme",c_last:"Son durum",c_time:"Zaman",c_repair:"Onarım",c_result:"Sonuç",c_agents:"Kurulu bilgisayar",c_level:"Onarım izni",

const ICONS=["🔗","🛒","🧾","💳","📦","🏪","🍦","🍕","☕","🚚","📊","📅","👥","🖥️","🌐","⚙️","🔐","📧","📞","🗄️","📱","🏦","🧮","🛠️"];
const SVG_OK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const SVG_WARN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 6v8M12 18v.01"/></svg>';
const SVG_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9a12 12 0 0 1 16 0M7.5 12.5a7 7 0 0 1 9 0M11 16a2 2 0 0 1 2 0M3 3l18 18"/></svg>';
const SVG_EMPTY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';

// Token may arrive as ?t=… (preferred: iOS "Add to Home Screen" keeps the query) or #… (older links).
// It is kept in the URL on purpose so the home-screen shortcut captures it, and remembered per device.
let TOKEN="";try{TOKEN=new URLSearchParams(location.search).get("t")||location.hash.slice(1)||localStorage.getItem("bt")||"";if(TOKEN)localStorage.setItem("bt",TOKEN);}catch(e){TOKEN=new URLSearchParams(location.search).get("t")||location.hash.slice(1)||""}
let L="tr";try{L=localStorage.getItem("bl")||"tr"}catch(e){}
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const t=k=>(T[L]||T.tr)[k]??k;
const errT=m=>{const k="err_"+m,v=t(k);return v===k?m:v};
async function api(p,b){const r=await fetch(p,{method:b===undefined?"GET":"POST",headers:{"x-ui-token":TOKEN,"content-type":"application/json"},body:b===undefined?undefined:JSON.stringify(b)});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(typeof j.detail==="string"?j.detail:(r.status===422?"invalid":String(r.status)));return j}
// server times are UTC; show them in the phone's local time
const toDate=s=>{if(!s)return null;let x=String(s);if(!/[zZ]$|[+-]\d\d:?\d\d$/.test(x))x+="Z";const d=new Date(x);return isNaN(d)?null:d};
const loc=()=>L==="de"?"de-DE":"tr-TR";
const fmt=s=>{const d=toDate(s);return d?d.toLocaleString(loc(),{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):"–"};
function i18n(){document.documentElement.lang=L;$$("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));$("#lang").value=L;$("#appsEdit").textContent=t(EDIT?"done":"edit")}
let PAGE="home",HERO_GO=null;
function show(p){PAGE=p;$$("main>section").forEach(s=>s.classList.toggle("hidden",s.id!=="p-"+p));$$("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.p===p));
 $("#hero").classList.toggle("compact",p!=="home");window.scrollTo(0,0);if(p==="settings")tgLoad()}
function outcome(r){if(r.action==="tool.denied")return`<span class="bad">${t("denied")}</span> <span class="small">${esc((r.reasons||[]).join(", "))}</span>`;
 if(r.outcome==="executed_verified")return`<span class="ok">${t("verified")}</span>`;if(r.outcome==="executed_unverified")return`<span class="bad">${t("unverified")}</span>`;return`<span class="bad">${t("failed")}</span>`}
function findCard(f){const d=f.diagnosis;return`<div class="item"><div class="ih"><span class="tri ${esc(f.triage)}">${esc(f.triage==="important"?"!":"?")}</span><b>${esc(f.title)}</b></div>
 <div class="meta">${esc(fmt(f.at))} · ${esc(f.customer)} · ${esc(f.device)} · ×${f.occurrences}${f.repair_tool?" · 🔧 "+esc(f.repair_tool):""}</div>
 ${(f.evidence||[]).map(e=>`<div class="ev">${esc(e.source)} ${esc(e.code||"")} ${esc(e.text)}</div>`).join("")}
 ${d?`<div class="meta">${t("ai")}: ${esc(d.produced_by)}</div><div style="margin-top:4px">${esc(d.summary)}</div>
 ${d.hypotheses.map(h=>`<div style="margin-top:4px"><span class="conf">${esc(h.confidence)}</span>${esc(h.cause)}</div>`).join("")}
 ${d.recommendations.map(r=>`<div class="meta">→ ${esc(r)}</div>`).join("")}`:""}</div>`}

function renderHero(o){
 const ag=o.devices.filter(d=>d.kind==="agent"&&d.status==="active"),on=ag.filter(d=>d.online).length,off=ag.length-on;
 const imp=o.tenants.reduce((a,x)=>a+x.important_24h,0);
 let cls,h,sub,core,st;
 if(!ag.length){cls="idle";h=t("h_empty");sub=t("s_empty");core=SVG_EMPTY;st=t("st_empty")}
 else if(off){cls="crit";h=t("h_off").replace("{n}",off);sub=t("s_off").replace("{n}",off);core=SVG_OFF;st=t("st_off").replace("{n}",off)}
 else if(imp){cls="warn";h=imp===1?t("h_issue1"):t("h_issue").replace("{n}",imp);sub=t("s_issue").replace("{n}",imp);core=SVG_WARN;st=t("st_issue").replace("{n}",imp)}
 else{cls="ok";h=t("h_ok");sub=t("s_ok").replace("{on}",on).replace("{all}",ag.length);core=SVG_OK;st=t("st_ok")}
 $("#hero").classList.remove("s-ok","s-warn","s-crit","s-idle");$("#hero").classList.add("s-"+cls);
 HERO_GO=cls==="crit"?"devices":cls==="warn"?"findings":cls==="idle"?null:null;$(".big").classList.toggle("tap",!!HERO_GO);$("#headline").innerHTML=h;$("#subline").textContent=sub;$("#core").innerHTML=core;
 const last=ag.map(d=>toDate(d.last_seen_at)).filter(Boolean).sort((a,b)=>b-a)[0];
 $("#updated").textContent=last?t("updated").replace("{t}",last.toLocaleString(loc(),{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})):"\u00a0";
 $("#tStatus").textContent=st;$("#kImp").textContent=imp;
 $("#tileStatus").className="tile wide "+(cls==="idle"?"":"s-"+cls);
 $("#kOnline").innerHTML=`${on}<small>/ ${ag.length}</small>`;$("#tileDev").className="tile "+(ag.length&&!off?"s-ok":off?"s-crit":"");
 $("#bellN").textContent=imp;$("#bellN").classList.toggle("hidden",!imp);
}

async function load(){
 const o=await api("/api/overview"),f=await api("/api/findings?hours="+$("#hoursF").value+"&all="+$("#allF").checked),r=await api("/api/repairs?hours=168");
 renderHero(o);
 $("#kCust").textContent=o.tenants.length;$("#kRep").textContent=r.repairs.filter(x=>x.action==="tool.executed").length;
 const imp=f.findings.filter(x=>x.triage==="important").slice(0,8);
 $("#homeList").innerHTML=imp.map(x=>`<div class="item"><div class="ih"><span class="tri important">!</span><b>${esc(x.title)}</b></div><div class="meta">${esc(fmt(x.at))} · ${esc(x.customer)} · ${esc(x.device)}</div></div>`).join("")||`<div class="item small">${t("none")}</div>`;
 $("#devs").innerHTML=o.devices.map(d=>`<div class="item"><div class="ih"><span class="dot ${d.kind!=="agent"?"na":d.online?"on":"off"}"></span><b>${esc(d.label)}</b><span class="chip">${esc(t(d.kind))}</span>${d.status!=="active"?`<span class="bad">(${t("revoked")})</span>`:""}</div>
  <div class="meta">${esc(d.customer)} · ${t("c_seen")}: ${esc(fmt(d.last_seen_at))}</div>
  ${d.last_status?`<div class="meta">${t("c_last")}: ${esc((d.last_status.repairs||[]).join(", ")||("cycles "+d.last_status.cycles))}</div>`:""}
  ${d.kind==="agent"?`<div class="meta">💾 ${d.backup?esc(d.backup.paths.join("; "))+" ("+d.backup.max_age_days+" "+t("days")+")":t("backup_none")}</div>`:""}
  <div class="meta tiny">${esc(d.id)}</div>
  <div class="acts">${d.kind==="agent"&&d.status==="active"?`<button class="sec" data-bak="${esc(d.id)}">💾 ${t("backup")}</button>`:""}${d.status==="active"?`<button class="sec" data-rev="${esc(d.id)}">${t("revoke")}</button>`:""}<button class="sec" data-del="${esc(d.id)}">${t("delete")}</button></div></div>`).join("")||`<div class="item small">${t("none")}</div>`;
 $$("[data-rev]").forEach(b=>b.onclick=async()=>{if(confirm(t("revoke_q"))){await api("/api/devices/"+encodeURIComponent(b.dataset.rev)+"/revoke",{});load()}});
 $$("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm(t("delete_q"))){await api("/api/devices/"+encodeURIComponent(b.dataset.del)+"/delete",{});load()}});
 $$("[data-bak]").forEach(b=>b.onclick=async()=>{const cur=(o.devices.find(x=>x.id===b.dataset.bak)||{}).backup||{};
  const pth=prompt(t("backup_q"),(cur.paths||[]).join("; "));if(pth===null)return;let days=cur.max_age_days||2;
  if(pth.trim()){const n=prompt(t("backup_days_q"),String(days));if(n===null)return;days=Math.max(1,Math.min(60,parseInt(n,10)||2))}
  try{await api("/api/devices/"+encodeURIComponent(b.dataset.bak)+"/backup-policy",{paths:pth.split(";").map(x=>x.trim()).filter(Boolean),max_age_days:days});load()}catch(e){alert(errT(e.message))}});
 $("#finds").innerHTML=f.findings.map(findCard).join("")||`<div class="item small">${t("none")}</div>`;
 $("#reps").innerHTML=r.repairs.map(x=>`<div class="item"><div class="ih"><b>${esc(x.tool_id)}</b> ${outcome(x)}</div>
  <div class="meta">${esc(fmt(x.at))} · ${esc(x.customer)} · ${esc(x.device)}${Object.keys(x.params||{}).length?" · "+esc(Object.values(x.params).join(" ")):""}</div></div>`).join("")||`<div class="item small">${t("none")}</div>`;
 $("#custs").innerHTML=o.tenants.map(c=>`<div class="item"><div class="ih"><b>${esc(c.name)}</b><span class="chip">${c.online} / ${c.agents} ${t("t_online")}</span></div>
  <div class="meta tiny">${esc(c.id)}</div><label class="f" style="margin-top:10px">${t("c_level")}</label>
  <select data-lvl="${esc(c.id)}" style="width:100%;margin-top:4px;padding:9px">${[0,1,2].map(l=>`<option value="${l}" ${l===c.repair_level?"selected":""}>${t("l"+l)}</option>`).join("")}</select> <span class="small" id="sv-${esc(c.id)}"></span></div>`).join("")||`<div class="item small">${t("none")}</div>`;
 $$("[data-lvl]").forEach(s=>s.onchange=async()=>{await api("/api/tenants/"+encodeURIComponent(s.dataset.lvl)+"/repair-level",{level:+s.value});$("#sv-"+s.dataset.lvl).textContent=t("saved")})}

// ---------- telegram ----------
function tgRender(s){$("#tgOff").classList.toggle("hidden",s.state!=="off");$("#tgPending").classList.toggle("hidden",s.state!=="pending");
 $("#tgOn").classList.toggle("hidden",s.state!=="on");
 $("#tgState").innerHTML=s.state==="on"?`<span class="ok">${t("tg_on")}</span> @${esc(s.bot)}${s.chat_name?" → "+esc(s.chat_name):""}`:`<span class="small">${t(s.state==="pending"?"tg_pending_state":"tg_off_state")}</span>`;
 $("#tgPendingTxt").textContent=t("tg_pending").replace("{bot}","@"+(s.bot||""));
 $("#tTg").textContent=t(s.state==="on"?"tg_tile_on":"tg_tile_off");$("#kTg").innerHTML=s.state==="on"?`<span class="ok">✓</span>`:"–"}
async function tgLoad(){try{tgRender(await api("/api/settings/telegram"))}catch(e){}}
async function tgDo(path,body){$("#tgMsg").textContent="…";try{const s=await api(path,body===undefined?{}:body);
 $("#tgMsg").innerHTML=s.state?"":`<span class="ok">${t("tg_sent")}</span>`;if(s.state){tgRender(s);if(s.state==="on"&&path.endsWith("/connect"))$("#tgMsg").innerHTML=`<span class="ok">${t("tg_sent")}</span>`}}
 catch(e){$("#tgMsg").innerHTML=`<span class="bad">${esc(errT(e.message))}</span>`}}
$("#tgSave").onclick=async()=>{await tgDo("/api/settings/telegram/token",{token:$("#tgToken").value.trim()});$("#tgToken").value=""};
$("#tgConnect").onclick=()=>tgDo("/api/settings/telegram/connect");
$("#tgTest").onclick=()=>tgDo("/api/settings/telegram/test");
$("#tgOffBtn").onclick=()=>{if(confirm(t("tg_off_q")))tgDo("/api/settings/telegram/off")};

// ---------- wiring ----------
$$("#nav button").forEach(b=>b.onclick=()=>show(b.dataset.p));
$$("[data-go]").forEach(b=>b.onclick=()=>show(b.dataset.go));
$("#bell").onclick=()=>show("findings");$(".big").onclick=()=>{if(HERO_GO)show(HERO_GO)};
$("#lang").onchange=e=>{L=e.target.value;try{localStorage.setItem("bl",L)}catch(x){}i18n();renderApps();tgLoad();load().catch(()=>{})};
$("#allF").onchange=()=>load().catch(()=>{});$("#hoursF").onchange=()=>load().catch(()=>{});
// "Kapat" shuts the panel down and cannot be reopened from a browser, so hide it on remote
// (phone) access; it is only shown on the PC itself (127.0.0.1), where the panel can be restarted.
if(!["127.0.0.1","localhost","[::1]"].includes(location.hostname)){$("#quit").style.display="none"}
$("#quit").onclick=async()=>{if(!confirm(t("quit_q")))return;try{await api("/api/quit",{})}catch(e){}document.querySelector("main").innerHTML=`<div class="item">${t("closed")}</div>`};
i18n();renderApps();tgLoad();appsLoad();
load().catch(e=>document.querySelector("main").insertAdjacentHTML("afterbegin",`<div class="item bad">${esc(e.message==="bad_token"?t("need_token"):e.message)}</div>`));
setInterval(()=>load().catch(()=>{}),60000);
</script>
</body>
</html>
