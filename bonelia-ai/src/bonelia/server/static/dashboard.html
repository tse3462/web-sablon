<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BONELİA AI">
<meta name="theme-color" content="#07090d">
<title>BONELİA AI Kontrol Paneli</title>
<style>
:root{--bg:#07090d;--panel:#121820;--panel2:#18202b;--ink:#eef2f7;--muted:#8b97a8;--line:#222b37;--brand:#3d8bff;
 --ok:#33c26f;--warn:#f0b429;--crit:#ff5a5f;--chip:#1c2430;--accent:var(--brand)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;padding:calc(env(safe-area-inset-top) + 12px) 18px 22px;text-align:center;
 background:
  radial-gradient(1.4px 1.4px at 9% 14%,#ffffffb0 50%,transparent 52%),radial-gradient(1px 1px at 21% 38%,#ffffff80 50%,transparent 52%),
  radial-gradient(1.2px 1.2px at 34% 9%,#ffffff99 50%,transparent 52%),radial-gradient(1px 1px at 47% 27%,#ffffff70 50%,transparent 52%),
  radial-gradient(1.5px 1.5px at 63% 16%,#ffffffb0 50%,transparent 52%),radial-gradient(1px 1px at 76% 33%,#ffffff80 50%,transparent 52%),
  radial-gradient(1.2px 1.2px at 88% 11%,#ffffff99 50%,transparent 52%),radial-gradient(1px 1px at 93% 41%,#ffffff60 50%,transparent 52%),
  radial-gradient(1px 1px at 4% 46%,#ffffff60 50%,transparent 52%),radial-gradient(1.2px 1.2px at 55% 44%,#ffffff70 50%,transparent 52%),
  radial-gradient(90% 60% at 50% 100%,color-mix(in srgb,var(--accent) 26%,transparent) 0%,transparent 70%),
  linear-gradient(180deg,#0b1a33 0%,#0a1322 52%,var(--bg) 100%)}
.hero.s-ok{--accent:var(--ok)}.hero.s-warn{--accent:var(--warn)}.hero.s-crit{--accent:var(--crit)}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;position:relative;z-index:2}.topbar>.iconbtn{justify-self:start}
.topbar .title{font-weight:800;font-size:clamp(22px,6.4vw,28px);letter-spacing:.3px;white-space:nowrap;text-align:center}.topbar .title [data-i=platform]{display:block;font-size:12px;font-weight:600!important;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)!important;margin-top:1px}
.topbar .title span{color:var(--brand)}
.iconbtn{position:relative;background:none;border:0;padding:6px;color:var(--ink);width:40px}
.iconbtn svg{width:26px;height:26px}
.badge{position:absolute;top:0;right:2px;background:var(--crit);color:#fff;border-radius:10px;font-size:11px;font-weight:700;min-width:18px;height:18px;line-height:18px;padding:0 5px}
.tools{display:flex;gap:6px;align-items:center;justify-content:flex-end;min-width:40px}
select{background:#ffffff14;color:var(--ink);border:1px solid #ffffff22;border-radius:8px;padding:5px 6px;font:inherit;font-size:13px}
select option{background:var(--panel);color:var(--ink)}
.updated{margin-top:14px;font-size:14px;color:#c8d3e3cc}
.headline{margin:4px 0 0;padding-top:.12em;font-weight:900;font-size:clamp(46px,15vw,104px);line-height:.98;letter-spacing:-1.5px;
 background:linear-gradient(180deg,#fff 30%,#c4d2e8);-webkit-background-clip:text;background-clip:text;color:transparent}
.emblem{position:relative;width:150px;height:150px;margin:18px auto 6px}
.ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--accent) 55%,transparent)}
.ring.r2{inset:22px;border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.ring.r1{animation:pulse 3.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.82);opacity:.9}100%{transform:scale(1.12);opacity:0}}
.core{position:absolute;inset:44px;border-radius:50%;display:grid;place-items:center;color:#fff;
 background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--accent) 85%,#fff),var(--accent));
 box-shadow:0 0 40px color-mix(in srgb,var(--accent) 60%,transparent),0 0 90px color-mix(in srgb,var(--accent) 30%,transparent)}
.core svg{width:34px;height:34px}
.subline{color:#c8d3e3;font-size:14px;max-width:520px;margin:6px auto 0}
.hero .big{display:none}/* status now heads the live panel (user request 06.11.2026) */.big.tap{cursor:pointer}
.hero{padding-bottom:14px}

/* ---------- password vault ---------- */
.v-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.v-bar input{flex:1;min-width:140px;margin:0}
.v-grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 2px 6px}
.v-e{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.v-e .v-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.v-e .v-h small{color:var(--muted)}
.v-pw{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.v-pw code{font:15px ui-monospace,Menlo,monospace;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;letter-spacing:.06em;flex:1;min-width:150px;word-break:break-all}
.v-pw button,.v-pw a{padding:7px 10px;font-size:13px}.v-pw a{text-decoration:none}.v-note{white-space:pre-wrap;color:var(--muted);font-size:13px;margin-top:6px}
.v-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:520px}
.v-card input{margin:6px 0 10px}.v-warn{background:#3a2a10;border:1px solid #8a6a20;color:#ffd98a;border-radius:10px;padding:10px;font-size:13px;margin:10px 0}
.v-msg{min-height:18px;font-size:13px;margin-top:6px}.v-busy{color:var(--muted)}
/* ---------- navigation ---------- */
nav{display:flex;justify-content:center;gap:4px;padding:8px 12px;position:sticky;top:0;z-index:20;background:#07090dee;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav button{background:none;border:0;color:var(--muted);display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;position:relative}
nav button svg{width:20px;height:20px}
nav button.active{color:var(--ink);background:var(--chip);font-weight:600}
@media (max-width:820px){
 nav{position:fixed;top:auto;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(7,1fr);gap:0;padding:6px 2px calc(env(safe-area-inset-bottom) + 4px);border-top:1px solid var(--line);border-bottom:0}
 nav button{flex-direction:column;gap:3px;font-size:9.5px;padding:6px 0;border-radius:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 nav button svg{width:24px;height:24px}
 nav button.active{background:none}
 nav button.active::after{content:"";position:absolute;bottom:-2px;left:30%;right:30%;height:3px;border-radius:2px;background:var(--ink)}
 main{padding-bottom:calc(92px + env(safe-area-inset-bottom))!important}
}

/* ---------- content ---------- */
main{max-width:1100px;margin:0 auto;padding:16px 14px 40px}
h2{font-size:20px;margin:22px 4px 12px;font-weight:700}
.ph{margin-top:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (min-width:821px){.tiles{grid-template-columns:repeat(4,1fr)}.tile.wide{grid-column:span 2}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;min-height:120px;text-align:left;display:flex;flex-direction:column;position:relative;transition:transform .12s}
.tile:active{transform:scale(.98)}
.tile.wide{grid-column:span 2}
.tt{font-weight:700;font-size:16px}
.tv{color:var(--muted);font-size:14px;margin-top:1px}
.tfoot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;padding-top:14px}
.tfoot svg{width:28px;height:28px;color:var(--ink);opacity:.9}
.tbig{font-size:34px;font-weight:800;line-height:1}
.tbig small{font-size:15px;font-weight:600;color:var(--muted);margin-left:3px}
.tile.s-ok .tbig{color:var(--ok)}.tile.s-warn .tbig{color:var(--warn)}.tile.s-crit .tbig{color:var(--crit)}
.block{margin-top:6px}
.bh{display:flex;align-items:center;justify-content:space-between}
.link{background:none;border:0;color:var(--brand);font-weight:600;padding:8px 4px}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 8px 12px;position:relative;min-height:116px;text-align:center}
.app .ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:28px;background:linear-gradient(145deg,#25324a,#141b26);box-shadow:inset 0 1px 0 #ffffff14}
.app .an{font-size:13px;font-weight:600;line-height:1.2;word-break:break-word}
.app .ah{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app.add{border-style:dashed;color:var(--muted);background:transparent;justify-content:center;font:inherit}
.app.add .ic{background:var(--chip);font-size:26px;color:var(--ink)}
.app .ed{display:none;gap:4px;margin-top:4px}
.editing .app .ed{display:flex}
.editing a.app{pointer-events:none}.editing a.app .ed{pointer-events:auto}
.ed button{background:var(--chip);border:0;border-radius:8px;padding:3px 7px;font-size:13px}
.hint{color:var(--muted);font-size:13px;margin:10px 4px 0}
.item{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.ih{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meta{color:var(--muted);font-size:13px;margin-top:4px;word-break:break-word}
.tiny{font-size:11px;opacity:.7}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{background:var(--chip);color:var(--muted);font-size:12px;border-radius:20px;padding:2px 9px}
.btn{background:var(--brand);color:#fff;border:0;padding:10px 16px;border-radius:10px;font-weight:600}
.sec{background:var(--chip);color:var(--ink);border:0;padding:9px 14px;border-radius:10px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}.off{background:var(--crit)}.na{background:var(--muted)}
.tri{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;color:#fff}.important{background:var(--crit)}.check{background:var(--warn);color:#111}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--crit);font-weight:600}.small{font-size:13px;color:var(--muted)}
.ev{font-size:12px;background:var(--chip);border-radius:8px;padding:6px 9px;margin:8px 0;word-break:break-word}
.conf{font-size:11px;padding:1px 7px;border-radius:10px;background:var(--chip);margin-right:6px}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 4px 12px;color:var(--muted);font-size:14px}
input[type=text],input[type=url],input[type=password],input[type=search],textarea.links{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px;width:100%;font:inherit;margin:6px 0 12px}
label.f{display:block;font-size:13px;color:var(--muted);margin-top:4px}
ol{padding-left:20px}
.list a{color:var(--ink)}
/* ---------- bottom sheet (app editor) ---------- */
.sheet{position:fixed;inset:0;z-index:50;background:#000a;display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:560px;padding:20px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:92vh;overflow:auto}
@media (min-width:821px){.sheet{align-items:center}.sheet-card{border-radius:22px}}
.sheet-card h3{margin:0 0 10px;font-size:18px}
.icons{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:6px 0 14px}
.icons button{background:var(--chip);border:2px solid transparent;border-radius:10px;font-size:22px;padding:6px 0}
.icons button.sel{border-color:var(--brand)}
.sheet-actions{display:flex;gap:10px;justify-content:flex-end}
/* ---------- live center (home) ---------- */
.live{--lb:#4aa8ff;--ll:#1e3a5f;--ld:#7f93b5;margin:4px 0 18px;padding:14px;border-radius:18px;background:radial-gradient(120% 90% at 50% 0%,#14284a 0%,#0b1120 62%);box-shadow:0 10px 40px #0006,inset 0 0 0 1px #1d3354}
.lv-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:6px 14px;margin:0 0 12px}
.lv-kick,.lv-meta,.lv-bh,.lv-row,.lv-read,.lv-sw,.lv-term,.lv-leg,.lv-days small{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em}
.lv-kick{font-size:12px;color:var(--lb);font-weight:700}.lv-title{font-size:21px;font-weight:800;color:#fff;text-shadow:0 0 18px #4aa8ff66}
.lv-meta{font-size:11px;color:var(--ld)}.lv-badge{display:inline-block;padding:1px 7px;border-radius:4px;background:#ff3b5c;color:#fff;font-weight:800;letter-spacing:.1em;margin-right:6px;animation:lvblink 1.4s steps(2,start) infinite}
@keyframes lvblink{50%{opacity:.35}}
.lv-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px}
@media (max-width:820px){.lv-grid{grid-template-columns:minmax(0,1fr)}.lv-title{font-size:18px}}
.lv-b{position:relative;padding:10px 12px;border:1px solid var(--ll);border-radius:10px;background:linear-gradient(180deg,#0f1d34cc,#0b1528cc);min-width:0}
.lv-b::before,.lv-b::after{content:"";position:absolute;width:10px;height:10px;border-color:var(--lb);opacity:.7}
.lv-b::before{left:-1px;top:-1px;border-left:2px solid;border-top:2px solid;border-radius:4px 0 0 0}.lv-b::after{right:-1px;bottom:-1px;border-right:2px solid;border-bottom:2px solid;border-radius:0 0 4px 0}
.lv-bh{display:flex;justify-content:space-between;gap:8px;margin:0 0 8px;font-size:11px;color:var(--ld);text-transform:uppercase}.lv-acc{color:var(--lb);font-weight:700}
.lv-net-b{overflow:hidden}.lv-net{display:block;width:100%;height:auto;max-height:320px}
.lv-scan{position:absolute;left:0;right:0;top:0;height:40%;background:linear-gradient(180deg,transparent,#4aa8ff14 70%,#4aa8ff33);border-bottom:1px solid #4aa8ff55;pointer-events:none;animation:lvscan 4.5s linear infinite;z-index:1}
@keyframes lvscan{0%{transform:translateY(-100%)}100%{transform:translateY(250%)}}
.lv-mesh{transform-box:view-box;transform-origin:200px 150px;animation:lvspin 90s linear infinite}@keyframes lvspin{to{transform:rotate(360deg)}}
.lv-mesh line{stroke:#3b5b86;stroke-width:.6;opacity:.55}.lv-mesh circle{fill:#6f8fbf}.lv-mesh .lv-bright{fill:#9fd0ff;animation:lvtw 3s ease-in-out infinite}@keyframes lvtw{0%,100%{opacity:.25}50%{opacity:1}}
.lv-link{stroke:#2b4a75;stroke-width:1.4;stroke-dasharray:4 5}.lv-link.lv-on{stroke:var(--lb);animation:lvflow 1.6s linear infinite}.lv-link.lv-off{stroke:#ff5a5f88}@keyframes lvflow{to{stroke-dashoffset:-18}}
.lv-node circle{fill:#13233d;stroke:#2b4a75;stroke-width:1.5}.lv-node.lv-on circle{fill:#1b4f86;stroke:var(--lb);animation:lvnode 2.4s ease-in-out infinite}.lv-node.lv-off circle{fill:#3a1820;stroke:#ff5a5f}
@keyframes lvnode{0%,100%{filter:drop-shadow(0 0 4px #4aa8ff88)}50%{filter:drop-shadow(0 0 14px #4aa8ff)}}
.lv-node text{fill:#cfe3ff;font-size:15px}.lv-node .lv-lbl{fill:var(--ld);font-size:10.5px;font-family:ui-monospace,Menlo,monospace}.lv-node.lv-on .lv-lbl{fill:#cfe3ff}
.lv-core{fill:#2f8cf0;animation:lvcore 3s ease-in-out infinite}@keyframes lvcore{0%,100%{filter:drop-shadow(0 0 10px #4aa8ff)}50%{filter:drop-shadow(0 0 26px #7cc4ff)}}
.lv-ring{fill:none;stroke:#4aa8ff66;stroke-width:1.5;transform-box:view-box;transform-origin:200px 150px;animation:lvpulse 2.6s ease-out infinite}@keyframes lvpulse{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.45);opacity:0}}
.lv-coretx{fill:#fff;font-weight:800;font-size:20px}.lv-pkt{fill:#bfe2ff;filter:drop-shadow(0 0 4px #4aa8ff)}
.lv-term{display:grid;gap:2px;margin-top:6px;padding:8px 10px;border:1px solid var(--lb);border-radius:6px;background:#0a1426;font-size:12px;color:#cfe3ff;box-shadow:0 0 14px #4aa8ff33}.lv-term span:first-child{color:var(--lb);font-size:11px}
.lv-side{display:grid;gap:12px;align-content:start;min-width:0}
.lv-bars{display:grid;gap:6px}.lv-row{display:grid;grid-template-columns:minmax(0,1fr) 38% 26px;align-items:center;gap:8px;font-size:11px}.lv-row>span:first-child{color:var(--ld);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv-track{height:8px;border-radius:2px;background:#16263f;overflow:hidden}.lv-fill{display:block;height:100%;background:linear-gradient(90deg,#2f8cf0,#7cc4ff);box-shadow:0 0 8px #4aa8ff99;transform-origin:left;animation:lvgx .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes lvgx{from{transform:scaleX(0)}}.lv-row b{text-align:right;color:#fff;font-weight:600}
.lv-read{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin:0;font-size:12px}.lv-read dt{color:var(--ld);text-transform:uppercase}.lv-read dd{margin:0;text-align:right;color:#fff;font-weight:700}.lv-read .g{color:#7be0a8}.lv-read .r{color:#ff8a7a}
.lv-cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(16px,1fr));gap:4px}.lv-cell{aspect-ratio:1;border-radius:2px;background:#1a2c48;animation:lvin .5s ease-out both}.lv-cell.lv-on{background:#e8f2ff;animation:lvin .5s ease-out both,lvcell 2s ease-in-out .6s infinite}.lv-cell.lv-off{background:#ff5a5f}
@keyframes lvin{from{opacity:0;transform:scale(.4)}}@keyframes lvcell{0%,100%{box-shadow:0 0 4px #9fd0ff}50%{box-shadow:0 0 12px #cfe8ff}}
.lv-wide{grid-column:1/-1}.lv-days{display:flex;align-items:flex-end;gap:6px;height:90px}.lv-day{flex:1;display:grid;grid-template-rows:1fr auto;height:100%;gap:3px;min-width:0}
.lv-dbar{align-self:end;display:block;border-radius:2px 2px 0 0;background:linear-gradient(180deg,#9fd0ff,#2f8cf0);box-shadow:0 0 8px #4aa8ff66;transform-origin:bottom;animation:lvgy .8s cubic-bezier(.2,.8,.2,1) both}@keyframes lvgy{from{transform:scaleY(0)}}
.lv-days small{font-size:9px;color:var(--ld);text-align:center}
.lv-dn{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.lv-donut{width:120px;height:120px;flex:none;transform:rotate(-90deg)}.lv-donut text{transform:rotate(90deg);transform-origin:60px 60px}
.lv-dt{fill:none;stroke:#16263f;stroke-width:14}.lv-dp{fill:none;stroke-width:14;animation:lvdn 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes lvdn{from{stroke-dasharray:0 400}}
.lv-dv{fill:#fff;font-size:26px;font-weight:800}.lv-dl{fill:var(--ld);font-size:7px;letter-spacing:.1em}
.lv-leg{display:grid;gap:4px;font-size:11px;color:var(--ld)}.lv-leg span::before{content:"";display:inline-block;width:8px;height:8px;margin-right:6px;background:var(--c)}
.lv-sws{display:grid;gap:8px;margin:0;padding:0;list-style:none;font-size:12px}.lv-sw{display:grid;grid-template-columns:1fr 46px 58px;align-items:center;gap:8px}
.lv-st{position:relative;height:2px;background:#2b4a75}.lv-st::after{content:"";position:absolute;right:0;top:-4px;width:10px;height:10px;border-radius:50%;background:#55657f}
.lv-sw.lv-on .lv-st{background:var(--lb)}.lv-sw.lv-on .lv-st::after{background:var(--lb);box-shadow:0 0 8px var(--lb);animation:lvnode 2.4s ease-in-out infinite}.lv-sw.lv-on b{color:#7be0a8}
.lv-sw.lv-off .lv-st::after{left:0;right:auto}.lv-sw.lv-off b{color:#ff8a7a}.lv-sw b{text-align:right;font-size:11px}
.lv-quiet .lv-fill,.lv-quiet .lv-dbar,.lv-quiet .lv-cell,.lv-quiet .lv-dp{animation:none}.lv-quiet .lv-cell.lv-on{animation:lvcell 2s ease-in-out infinite}

 try{const uj=await api("/api/uptime");UP=uj.apps;REPAIR_READY=!!uj.repair_ready}catch(e){UP=[]}
 const o=await api("/api/overview"),f=await api("/api/findings?hours="+$("#hoursF").value+"&all="+$("#allF").checked),r=await api("/api/repairs?hours=168");
 renderHero(o);renderLive(o,f,r);renderApps();
 $("#kCust").textContent=o.tenants.length;$("#kRep").textContent=r.repairs.filter(x=>x.action==="tool.executed").length;
 const imp=f.findings.filter(x=>x.triage==="important").slice(0,8);
 $("#homeList").innerHTML=imp.map(x=>`<div class="item"><div class="ih"><span class="tri important">!</span><b>${esc(x.title)}</b></div><div class="meta">${esc(fmt(x.at))} · ${esc(x.customer)} · ${esc(x.device)}</div></div>`).join("")||`<div class="item small">${t("none")}</div>`;
 $("#devs").innerHTML=o.devices.map(d=>`<div class="item"><div class="ih"><span class="dot ${d.kind!=="agent"?"na":d.online?"on":"off"}"></span><b>${esc(d.label)}</b><span class="chip">${esc(t(d.kind))}</span>${d.status!=="active"?`<span class="bad">(${t("revoked")})</span>`:""}</div>
  <div class="meta">${esc(d.customer)} · ${t("c_seen")}: ${esc(fmt(d.last_seen_at))}</div>
  ${d.last_status?`<div class="meta">${t("c_last")}: ${esc((d.last_status.repairs||[]).join(", ")||("cycles "+d.last_status.cycles))}</div>`:""}
  ${remoteLine(d)}
  ${d.kind==="agent"?`<div class="meta">💾 ${d.backup?esc(d.backup.paths.join("; "))+" ("+d.backup.max_age_days+" "+t("days")+")":t("backup_none")}</div>`:""}
  <div class="meta tiny">${esc(d.id)}</div>
  <div class="acts">${d.kind==="agent"&&d.status==="active"?`<button class="sec" data-bak="${esc(d.id)}">💾 ${t("backup")}</button>`:""}${d.status==="active"?`<button class="sec" data-rev="${esc(d.id)}">${t("revoke")}</button>`:""}<button class="sec" data-del="${esc(d.id)}">${t("delete")}</button></div></div>`).join("")||`<div class="item small">${t("none")}</div>`;
 $$("[data-rev]").forEach(b=>b.onclick=async()=>{if(confirm(t("revoke_q"))){await api("/api/devices/"+encodeURIComponent(b.dataset.rev)+"/revoke",{});load()}});
 $$("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm(t("delete_q"))){await api("/api/devices/"+encodeURIComponent(b.dataset.del)+"/delete",{});load()}});
 $$("[data-bak]").forEach(b=>b.onclick=async()=>{const cur=(o.devices.find(x=>x.id===b.dataset.bak)||{}).backup||{};
  const pth=prompt(t("backup_q"),(cur.paths||[]).join("; "));if(pth===null)return;let days=cur.max_age_days||2;
  if(pth.trim()){const n=prompt(t("backup_days_q"),String(days));if(n===null)return;days=Math.max(1,Math.min(60,parseInt(n,10)||2))}
  try{await api("/api/devices/"+encodeURIComponent(b.dataset.bak)+"/backup-policy",{paths:pth.split(";").map(x=>x.trim()).filter(Boolean),max_age_days:days});load()}catch(e){alert(errT(e.message))}});
 $("#finds").innerHTML=f.findings.map(findCard).join("")||`<div class="item small">${t("none")}</div>`;
 $("#reps").innerHTML=r.repairs.map(x=>`<div class="item"><div class="ih"><b>${esc(x.tool_id)}</b> ${outcome(x)}</div>
  <div class="meta">${esc(fmt(x.at))} · ${esc(x.customer)} · ${esc(x.device)}${Object.keys(x.params||{}).length?" · "+esc(Object.values(x.params).join(" ")):""}</div></div>`).join("")||`<div class="item small">${t("none")}</div>`;
 $("#custs").innerHTML=o.tenants.map(c=>`<div class="item"><div class="ih"><b>${esc(c.name)}</b><span class="chip">${c.online} / ${c.agents} ${t("t_online")}</span></div>
  <div class="meta tiny">${esc(c.id)}</div><label class="f" style="margin-top:10px">${t("c_level")}</label>
  <select data-lvl="${esc(c.id)}" style="width:100%;margin-top:4px;padding:9px">${[0,1,2].map(l=>`<option value="${l}" ${l===c.repair_level?"selected":""}>${t("l"+l)}</option>`).join("")}</select> <span class="small" id="sv-${esc(c.id)}"></span></div>`).join("")||`<div class="item small">${t("none")}</div>`;
 $$("[data-lvl]").forEach(s=>s.onchange=async()=>{await api("/api/tenants/"+encodeURIComponent(s.dataset.lvl)+"/repair-level",{level:+s.value});$("#sv-"+s.dataset.lvl).textContent=t("saved")})}

// ---------- my apps ----------
let APPS=[],EDIT=false,EDIT_ID=null,ICON="🔗";
const host=u=>{try{return new URL(u).host}catch(e){return u}};
function renderApps(){
 $("#apps").classList.toggle("editing",EDIT);
 $("#apps").innerHTML=APPS.map(a=>{const u=(UP||[]).find(x=>x.id===a.id);return `<a class="app${u&&u.status==="down"?" app-down":""}" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${u&&u.status!=="paused"?`<span class="app-up ${esc(u.status)}" title="${esc(u.uptime_24h??"–")} %"></span>`:""}<div class="ic">${esc(a.icon||"🔗")}</div><div class="an">${esc(a.name)}</div><div class="ah">${esc(host(a.url))}</div>
  <div class="ed"><button data-mv="${esc(a.id)}" data-st="-1" aria-label="◀">◀</button><button data-ed="${esc(a.id)}" aria-label="✎">✎</button><button data-rm="${esc(a.id)}" aria-label="✕">✕</button><button data-mv="${esc(a.id)}" data-st="1" aria-label="▶">▶</button></div></a>`}).join("")
  +`<button class="app add" id="appAdd"><div class="ic">＋</div><div class="an">${t("add")}</div></button>`;
 $("#appAdd").onclick=()=>openSheet(null);
 $$("[data-ed]").forEach(b=>b.onclick=e=>{e.preventDefault();openSheet(APPS.find(a=>a.id===b.dataset.ed))});
 $$("[data-rm]").forEach(b=>b.onclick=async e=>{e.preventDefault();if(!confirm(t("app_del_q")))return;APPS=(await api("/api/apps/"+encodeURIComponent(b.dataset.rm)+"/delete",{})).apps;renderApps()});
 $$("[data-mv]").forEach(b=>b.onclick=async e=>{e.preventDefault();APPS=(await api("/api/apps/"+encodeURIComponent(b.dataset.mv)+"/move?step="+b.dataset.st,{})).apps;renderApps()});
}
async function appsLoad(){try{APPS=(await api("/api/apps")).apps;renderApps()}catch(e){}}
function openSheet(a){EDIT_ID=a?a.id:null;ICON=a?a.icon:"🔗";$("#sheetTitle").textContent=t(a?"app_edit":"app_add");
 $("#appName").value=a?a.name:"";$("#appUrl").value=a?a.url:"https://";$("#appMsg").textContent="";
 $("#appMon").checked=a?a.monitor!==false:true;$("#appCheck").value=a&&a.check_url?a.check_url:"";$("#appKey").value=a&&a.keyword?a.keyword:"";
 $("#appLinks").value=a&&a.links?a.links.map(l=>l.label+" "+l.url).join("\n"):"";
 $("#appRepo").value=a&&a.repair_repo?a.repair_repo:"";$("#appRepoToken").value="";$("#appRepoToken").placeholder=REPAIR_READY?t("rp_token_set"):"github_pat_…";
 $("#iconPick").innerHTML=ICONS.map(i=>`<button type="button" class="${i===ICON?"sel":""}" data-ic="${i}">${i}</button>`).join("");
 $$("[data-ic]").forEach(b=>b.onclick=()=>{ICON=b.dataset.ic;$$("[data-ic]").forEach(x=>x.classList.toggle("sel",x===b))});
 $("#sheet").classList.remove("hidden");setTimeout(()=>$("#appName").focus(),50)}
$("#appCancel").onclick=()=>$("#sheet").classList.add("hidden");
$("#sheet").onclick=e=>{if(e.target.id==="sheet")$("#sheet").classList.add("hidden")};
$("#appSave").onclick=async()=>{const body={name:$("#appName").value.trim(),url:$("#appUrl").value.trim(),icon:ICON,
  monitor:$("#appMon").checked,check_url:$("#appCheck").value.trim()||null,keyword:$("#appKey").value.trim()||null,links:$("#appLinks").value,
  repair_repo:$("#appRepo").value.trim()||null,repair_token:$("#appRepoToken").value.trim()||null};if(EDIT_ID)body.id=EDIT_ID;
 try{APPS=(await api("/api/apps",body)).apps;$("#sheet").classList.add("hidden");renderApps()}catch(e){$("#appMsg").textContent=errT(e.message)}};
$("#appsEdit").onclick=()=>{EDIT=!EDIT;$("#appsEdit").textContent=t(EDIT?"done":"edit");renderApps()};

// ---------- telegram ----------
let TG_STATE="off";
function tgRender(s){TG_STATE=s.state;$("#tgOff").classList.toggle("hidden",s.state!=="off");$("#tgPending").classList.toggle("hidden",s.state!=="pending");
 $("#tgOn").classList.toggle("hidden",s.state!=="on");
 $("#tgState").innerHTML=s.state==="on"?`<span class="ok">${t("tg_on")}</span> @${esc(s.bot)}${s.chat_name?" → "+esc(s.chat_name):""}`:`<span class="small">${t(s.state==="pending"?"tg_pending_state":"tg_off_state")}</span>`;
 $("#tgPendingTxt").textContent=t("tg_pending").replace("{bot}","@"+(s.bot||""));
 $("#tTg").textContent=t(s.state==="on"?"tg_tile_on":"tg_tile_off");renderLive();$("#kTg").innerHTML=s.state==="on"?`<span class="ok">✓</span>`:"–"}
async function tgLoad(){try{tgRender(await api("/api/settings/telegram"))}catch(e){}}
async function tgDo(path,body){$("#tgMsg").textContent="…";try{const s=await api(path,body===undefined?{}:body);
 $("#tgMsg").innerHTML=s.state?"":`<span class="ok">${t("tg_sent")}</span>`;if(s.state){tgRender(s);if(s.state==="on"&&path.endsWith("/connect"))$("#tgMsg").innerHTML=`<span class="ok">${t("tg_sent")}</span>`}}
 catch(e){$("#tgMsg").innerHTML=`<span class="bad">${esc(errT(e.message))}</span>`}}
$("#tgSave").onclick=async()=>{const v=$("#tgToken").value;await tgDo("/api/settings/telegram/token",{token:v});if(TG_STATE!=="off")$("#tgToken").value="";else if($("#tgMsg .bad"))$("#tgMsg").insertAdjacentHTML("beforeend",`<div class="small">${t("tg_len").replace("{n}",v.trim().length)}</div>`)};
$("#tgConnect").onclick=()=>tgDo("/api/settings/telegram/connect");
$("#tgTest").onclick=()=>tgDo("/api/settings/telegram/test");
$("#tgOffBtn").onclick=()=>{if(confirm(t("tg_off_q")))tgDo("/api/settings/telegram/off")};

// ---------- password vault (06.11.2026): opened only here, with the master password; the server sees ciphertext
let VMETA=null,VENT=[],VKEY=null,VSHOW={},VLAST=0,VTIMER=null,VFORM=null,VQ="";
const VLOCK_MS=5*60*1000,V=globalThis.BoneliaVault;
async function vaultLoad(){try{const j=await api("/api/vault");VMETA=j.meta;VENT=j.entries}catch(e){}renderVault()}
function vaultLock(){if(VKEY)VKEY.fill(0);VKEY=null;VSHOW={};VFORM=null;clearTimeout(VTIMER);if(PAGE==="vault")renderVault()}
function vaultTouch(){VLAST=Date.now();clearTimeout(VTIMER);if(VKEY)VTIMER=setTimeout(vaultLock,VLOCK_MS)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&VKEY&&Date.now()-VLAST>VLOCK_MS)vaultLock()});
document.addEventListener("pointerdown",()=>{if(VKEY)vaultTouch()},{passive:true});
function vSecret(e){try{return V.open(VKEY,e.box)}catch(x){return null}}
const vId=id=>String(id||"").replace(/\B(?=(\d{3})+(?!\d))/g," ");
function vMsg(t_,bad){const m=$("#vMsg");if(m){m.textContent=t_||"";m.className="v-msg "+(bad?"bad":"v-busy")}}
function renderVault(){const host=$("#vault");if(!host)return;
 if(!V){host.innerHTML=`<div class="v-card bad">${t("vt_nolib")}</div>`;return}
 if(!VMETA){host.innerHTML=`<div class="v-card"><b>${t("vt_new_t")}</b><p class="small">${t("vt_new_p")}</p>
  <div class="v-warn">${t("vt_warn")}</div>
  <label class="f">${t("vt_master")}</label><input id="vP1" type="password" autocomplete="new-password" minlength="10">
  <label class="f">${t("vt_master2")}</label><input id="vP2" type="password" autocomplete="new-password">
  <button class="btn" id="vCreate">${t("vt_create")}</button><div id="vMsg" class="v-msg"></div></div>`;
  $("#vCreate").onclick=vaultCreate;return}
 if(!VKEY){host.innerHTML=`<div class="v-card"><b>🔒 ${t("vt_locked")}</b><p class="small">${t("vt_count").replace("{n}",VENT.length)}</p>
  <label class="f">${t("vt_master")}</label><input id="vP" type="password" autocomplete="current-password">
  <button class="btn" id="vOpen">${t("vt_open")}</button><div id="vMsg" class="v-msg"></div>
  <p class="small" style="margin-top:18px"><a href="#" id="vForgot">${t("vt_forgot")}</a></p></div>`;
  $("#vOpen").onclick=vaultOpen;$("#vP").onkeydown=e=>{if(e.key==="Enter")vaultOpen()};$("#vForgot").onclick=e=>{e.preventDefault();vaultReset()};
  setTimeout(()=>$("#vP")&&$("#vP").focus(),50);return}
 if(VFORM){renderVaultForm(host);return}
 const q=VQ.trim().toLowerCase(),list=VENT.filter(e=>!q||[e.title,e.customer,e.rustdesk_id].join(" ").toLowerCase().includes(q));
 const groups={};for(const e of list)(groups[e.customer||t("vt_nocust")]??=[]).push(e);
 host.innerHTML=`<div class="v-bar"><input id="vQ" type="search" placeholder="${t("vt_search")}" value="${esc(VQ)}"><button class="sec" id="vAdd">＋ ${t("vt_add")}</button><button class="sec" id="vLock">🔒 ${t("vt_lock")}</button></div>`
  +(list.length?"":`<p class="small">${t(VENT.length?"vt_nohit":"vt_empty")}</p>`)
  +Object.keys(groups).sort().map(g=>`<div class="v-grp">${esc(g)}</div>`+groups[g].map(vRow).join("")).join("");
 $("#vQ").oninput=e=>{VQ=e.target.value;const c=e.target.selectionStart;renderVault();const i=$("#vQ");i.focus();i.setSelectionRange(c,c)};
 $("#vAdd").onclick=()=>{VFORM={};renderVault()};$("#vLock").onclick=vaultLock;
 host.querySelectorAll("[data-vs]").forEach(b=>b.onclick=()=>{VSHOW[b.dataset.vs]=!VSHOW[b.dataset.vs];renderVault()});
 host.querySelectorAll("[data-vc]").forEach(b=>b.onclick=async()=>{const e=VENT.find(x=>x.id===b.dataset.vc),sec=e&&vSecret(e);if(!sec)return;
  const ok=await copyText(sec.password||"");const old=b.textContent;b.textContent=ok?t("rd_copied"):t("vt_copyfail");setTimeout(()=>{b.textContent=old},1500)});
 host.querySelectorAll("[data-vgo]").forEach(a=>a.onclick=()=>{const e=VENT.find(x=>x.id===a.dataset.vgo),sec=e&&vSecret(e);if(sec)copyOld(sec.password||"")});
 host.querySelectorAll("[data-vrot]").forEach(b=>b.onclick=async()=>{if(!confirm(t("vt_rot_q")))return;
  try{const j=await api("/api/vault/rotate/"+encodeURIComponent(b.dataset.vrot),{});VENT=j.entries;renderVault()}catch(x){alert(errT(x.message))}});
 host.querySelectorAll("[data-ved]").forEach(b=>b.onclick=()=>{const e=VENT.find(x=>x.id===b.dataset.ved),sec=e&&vSecret(e);if(!e||!sec)return;
  VFORM={id:e.id,title:e.title,customer:e.customer,...sec};renderVault()});
 host.querySelectorAll("[data-vdel]").forEach(b=>b.onclick=async()=>{if(!confirm(t("vt_del_q")))return;
  try{const j=await api("/api/vault/entries/"+encodeURIComponent(b.dataset.vdel)+"/delete",{});VENT=j.entries;renderVault()}catch(x){alert(errT(x.message))}})}
function vRow(e){const sec=vSecret(e),shown=VSHOW[e.id],pw=sec?String(sec.password||""):"";
 const head=`<div class="v-h"><b>${e.kind==="rustdesk"?"🖥 ":"🔑 "}${esc(e.title)}</b>${e.rustdesk_id?`<small>ID ${esc(vId(e.rustdesk_id))}</small>`:""}</div>`;
 if(!sec)return`<div class="v-e">${head}<div class="v-note bad">${t("vt_broken")}</div></div>`;
 const user=sec.user?`<div class="v-note">👤 ${esc(sec.user)}</div>`:"",note=sec.note?`<div class="v-note">${esc(sec.note)}</div>`:"";
 const rot=e.rotating?`<div class="v-note">⏳ ${t("vt_rotating")}</div>`:"";
 const acts=e.kind==="rustdesk"
  ?`<a class="btn" href="rustdesk://${esc(e.rustdesk_id)}" data-vgo="${esc(e.id)}">🖥 ${t("rd_connect")}</a><button class="sec" data-vrot="${esc(e.device_id)}">${t("vt_rotate")}</button>`
  :`<button class="sec" data-ved="${esc(e.id)}">✎</button><button class="sec" data-vdel="${esc(e.id)}">✕</button>`;
 return`<div class="v-e">${head}${user}<div class="v-pw"><code>${shown?esc(pw):"•".repeat(10)}</code>
  <button class="sec" data-vs="${esc(e.id)}">${shown?t("vt_hide"):t("vt_show")}</button><button class="sec" data-vc="${esc(e.id)}">${t("vt_copy")}</button></div>
  ${note}${rot}<div class="v-pw">${acts}</div></div>`}
function renderVaultForm(host){const f=VFORM,custs=[...new Set(VENT.map(e=>e.customer).filter(Boolean))];
 host.innerHTML=`<div class="v-card"><b>${f.id?t("vt_edit"):t("vt_add")}</b>
  <label class="f">${t("vt_title")}</label><input id="vfT" type="text" maxlength="60" value="${esc(f.title||"")}" placeholder="Router, Kasse, WLAN …">
  <label class="f">${t("vt_cust")}</label><input id="vfC" type="text" maxlength="60" list="vfCL" value="${esc(f.customer||"")}"><datalist id="vfCL">${custs.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
  <label class="f">${t("vt_user")}</label><input id="vfU" type="text" maxlength="120" autocomplete="off" autocapitalize="off" value="${esc(f.user||"")}">
  <label class="f">${t("vt_pw")}</label><div class="v-pw" style="margin:0"><input id="vfP" type="text" maxlength="200" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="flex:1;margin:6px 0 10px" value="${esc(f.password||"")}"><button class="sec" id="vfGen">${t("vt_gen")}</button></div>
  <label class="f">${t("vt_note")}</label><textarea id="vfN" class="links" maxlength="1000">${esc(f.note||"")}</textarea>
  <div class="sheet-actions"><button class="sec" id="vfX">${t("cancel")}</button><button class="btn" id="vfS">${t("tg_save")}</button></div><div id="vMsg" class="v-msg"></div></div>`;
 $("#vfGen").onclick=()=>{$("#vfP").value=V.randomPassword(16)};$("#vfX").onclick=()=>{VFORM=null;renderVault()};
 $("#vfS").onclick=async()=>{const title=$("#vfT").value.trim(),pw=$("#vfP").value;if(!title||!pw){vMsg(t("vt_need"),true);return}
  const box=V.seal(VMETA.pub,{password:pw,user:$("#vfU").value.trim(),note:$("#vfN").value.trim()});
  try{const j=await api("/api/vault/entries",{id:f.id||undefined,title,customer:$("#vfC").value.trim(),box});VENT=j.entries;VFORM=null;renderVault()}catch(x){vMsg(errT(x.message),true)}}}
async function vaultCreate(){const a=$("#vP1").value,b=$("#vP2").value;
 if(a.length<10){vMsg(t("vt_short"),true);return}if(a!==b){vMsg(t("vt_nomatch"),true);return}
 $("#vCreate").disabled=true;vMsg(t("vt_working"));
 try{const meta=await V.create(a);const j=await api("/api/vault/setup",{meta});VMETA=j.meta;VENT=j.entries;VKEY=await V.unlock(VMETA,a);vaultTouch();renderVault()}
 catch(x){vMsg(errT(x.message),true);$("#vCreate").disabled=false}}
async function vaultOpen(){const pw=$("#vP").value;if(!pw)return;$("#vOpen").disabled=true;vMsg(t("vt_working"));
 try{await vaultLoad();VKEY=await V.unlock(VMETA,pw);vaultTouch();renderVault()}
 catch(x){vMsg(x.message==="wrong_password"?t("vt_wrong"):errT(x.message),true);const b=$("#vOpen");if(b)b.disabled=false}}
async function vaultReset(){if(prompt(t("vt_reset_q"))!=="SIL")return;
 try{await api("/api/vault/reset",{confirm:"SIL"});VMETA=null;VENT=[];vaultLock();renderVault()}catch(x){alert(errT(x.message))}}
$$("#nav button").forEach(b=>b.onclick=()=>show(b.dataset.p));
$$("[data-go]").forEach(b=>b.onclick=()=>show(b.dataset.go));
$("#bell").onclick=()=>show("findings");$(".big").onclick=()=>{if(HERO_GO)show(HERO_GO)};
$("#lang").onchange=e=>{L=e.target.value;try{localStorage.setItem("bl",L)}catch(x){}i18n();renderApps();tgLoad();load().catch(()=>{})};
$("#allF").onchange=()=>load().catch(()=>{});$("#hoursF").onchange=()=>load().catch(()=>{});
// "Kapat" shuts the panel down and cannot be reopened from a browser, so hide it on remote
// (phone) access; it is only shown on the PC itself (127.0.0.1), where the panel can be restarted.
if(!["127.0.0.1","localhost","[::1]"].includes(location.hostname)){$("#quit").style.display="none"}
$("#quit").onclick=async()=>{if(!confirm(t("quit_q")))return;try{await api("/api/quit",{})}catch(e){}document.querySelector("main").innerHTML=`<div class="item">${t("closed")}</div>`};
i18n();renderApps();tgLoad();appsLoad();
load().catch(e=>document.querySelector("main").insertAdjacentHTML("afterbegin",`<div class="item bad">${esc(e.message==="bad_token"?t("need_token"):e.message)}</div>`));
setInterval(()=>load().catch(()=>{}),60000);
</script>
