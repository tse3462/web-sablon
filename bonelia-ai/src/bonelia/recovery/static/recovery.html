<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BONELİA AI Kurtarma</title><style>
:root{--bg:#f4f6f9;--panel:#fff;--ink:#132030;--muted:#5a6b7d;--line:#dde3ea;--brand:#0b5cad;--crit:#b00020;--warn:#b98900;--ok:#1b7f3a;--chip:#eef2f6}
@media (prefers-color-scheme:dark){:root{--bg:#0e141b;--panel:#151d26;--ink:#e6edf3;--muted:#93a4b5;--line:#253241;--brand:#4ea1ff;--chip:#1d2834}}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:18px}.logo span{color:var(--brand)}main{max-width:860px;margin:18px auto;padding:0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 4px}.card p{margin:0 0 8px;color:var(--muted)}
button{border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer;background:var(--chip);color:var(--ink)}
button.primary{background:var(--brand);color:#fff}button:disabled{opacity:.5;cursor:wait}
pre{background:var(--chip);border-radius:8px;padding:8px 10px;font-size:12px;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
.warnbox{background:#fff3cd;color:#664d03;border-radius:8px;padding:8px 10px;margin:8px 0}
@media (prefers-color-scheme:dark){.warnbox{background:#3a2f00;color:#ffe08a}}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--crit);font-weight:600}.muted{color:var(--muted);font-size:12px}
select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px}
.right{margin-left:auto}header .right{display:flex;gap:8px}
</style></head><body>
<header><div class="logo">BONELİA <span>AI</span> · <span data-i="title"></span></div>
<div class="right"><select id="lang"><option value="tr">TR</option><option value="de">DE</option><option value="en">EN</option></select>
<button id="quit" data-i="quit"></button></div></header>
<main>
<div id="adminWarn" class="warnbox hidden"></div>
<div class="card"><h3 data-i="inspect"></h3><p data-i="inspect_p"></p>
  <button data-op="restore_points" data-i="b_rp"></button>
  <button data-op="disk_health" data-i="b_disk"></button>
  <button data-op="pending_reboot" data-i="b_reboot"></button>
  <div id="rpList"></div><pre id="out_inspect" class="hidden"></pre></div>
<div class="card"><h3 data-i="repair"></h3><p data-i="repair_p"></p>
  <button class="primary" data-op="sfc" data-i="b_sfc"></button>
  <button class="primary" data-op="dism" data-i="b_dism"></button>
  <span class="muted" data-i="slow"></span><pre id="out_repair" class="hidden"></pre></div>
<div class="card"><h3 data-i="disk"></h3><p data-i="disk_p"></p>
  <select id="drive"><option>C:</option><option>D:</option><option>E:</option></select>
  <button data-op="chkdsk" data-confirm="chkdsk_q" data-i="b_chkdsk"></button><pre id="out_chkdsk" class="hidden"></pre></div>
<div class="card"><h3 data-i="restore"></h3><p data-i="restore_p"></p>
  <select id="rpSel"></select>
  <button data-op="restore" data-confirm="restore_q" data-i="b_restore"></button><pre id="out_restore" class="hidden"></pre></div>
<div class="card"><h3 data-i="boot"></h3><p data-i="boot_p"></p><ol id="bootGuide" class="muted"></ol></div>
</main>
<script>
const T={tr:{title:"Kurtarma",quit:"Kapat",inspect:"1) İncele (güvenli)",inspect_p:"Hiçbir şey değiştirmez.",b_rp:"Geri yükleme noktaları",b_disk:"Disk sağlığı",b_reboot:"Bekleyen yeniden başlatma",
repair:"2) Windows dosyalarını onar",repair_p:"Bozuk sistem dosyalarını ve Windows imajını onarır. Kişisel verilere dokunmaz.",b_sfc:"sfc /scannow",b_dism:"DISM onar",slow:"(uzun sürebilir)",
disk:"3) Disk kontrolü (yeniden başlatmada)",disk_p:"Seçili sürücüyü sonraki açılışta kontrol eder ve onarır.",b_chkdsk:"Planla",
restore:"4) Sistem geri yükleme",restore_p:"Windows'u seçili bir noktaya döndürür ve yeniden başlatır. Kişisel dosyalar etkilenmez.",b_restore:"Geri yükle",
boot:"5) Hiç açılmıyorsa (önyükleme)",boot_p:"Bu adım Windows kurtarma ortamında (WinRE) yapılır:",
admin:"Yönetici değil: onarım adımları için programı yönetici olarak açın (Bu-Bilgisayari-Kurtar.bat).",
chkdsk_q:"Seçili sürücü sonraki yeniden başlatmada kontrol edilsin mi?",restore_q:"Windows seçili noktaya döndürülecek ve yeniden başlatılacak. Devam?",
none:"Kayıt yok.",running:"Çalışıyor…",needc:"Önce bir geri yükleme noktası seçin.",done:"Tamam",fail:"Başarısız"},
de:{title:"Wiederherstellung",quit:"Schließen",inspect:"1) Prüfen (sicher)",inspect_p:"Verändert nichts.",b_rp:"Wiederherstellungspunkte",b_disk:"Datenträgerzustand",b_reboot:"Ausstehender Neustart",
repair:"2) Windows-Dateien reparieren",repair_p:"Repariert beschädigte Systemdateien und das Windows-Abbild. Keine persönlichen Daten.",b_sfc:"sfc /scannow",b_dism:"DISM reparieren",slow:"(kann lange dauern)",
disk:"3) Datenträgerprüfung (beim Neustart)",disk_p:"Prüft/repariert das Laufwerk beim nächsten Start.",b_chkdsk:"Planen",
restore:"4) Systemwiederherstellung",restore_p:"Setzt Windows auf einen Punkt zurück und startet neu. Persönliche Dateien bleiben.",b_restore:"Wiederherstellen",
boot:"5) Startet gar nicht (Boot)",boot_p:"Dieser Schritt erfolgt in der Windows-Wiederherstellungsumgebung (WinRE):",
admin:"Keine Administratorrechte: Reparaturen als Administrator starten (Bu-Bilgisayari-Kurtar.bat).",
chkdsk_q:"Laufwerk beim nächsten Neustart prüfen?",restore_q:"Windows wird zurückgesetzt und neu gestartet. Fortfahren?",
none:"Keine Einträge.",running:"Läuft…",needc:"Zuerst einen Punkt wählen.",done:"Fertig",fail:"Fehlgeschlagen"},
en:{title:"Recovery",quit:"Close",inspect:"1) Inspect (safe)",inspect_p:"Changes nothing.",b_rp:"Restore points",b_disk:"Disk health",b_reboot:"Pending reboot",
repair:"2) Repair Windows files",repair_p:"Repairs corrupted system files and the Windows image. No personal data.",b_sfc:"sfc /scannow",b_dism:"DISM repair",slow:"(may take long)",
disk:"3) Disk check (on restart)",disk_p:"Checks/repairs the drive on next boot.",b_chkdsk:"Schedule",
restore:"4) System Restore",restore_p:"Rolls Windows back to a point and restarts. Personal files are kept.",b_restore:"Restore",
boot:"5) Does not boot at all",boot_p:"This step is done in the Windows Recovery Environment (WinRE):",
admin:"Not administrator: start repairs as administrator (Bu-Bilgisayari-Kurtar.bat).",
chkdsk_q:"Check the selected drive on next restart?",restore_q:"Windows will be rolled back and restarted. Continue?",
none:"None.",running:"Working…",needc:"Select a restore point first.",done:"Done",fail:"Failed"}};
let TOKEN=location.hash.slice(1);try{if(TOKEN)sessionStorage.setItem("rt",TOKEN);else TOKEN=sessionStorage.getItem("rt")||""}catch(e){}
history.replaceState(null,"",location.pathname);let L="tr";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const t=k=>(T[L]||T.tr)[k]??k;
async function api(p,b){const r=await fetch(p,{method:b===undefined?"GET":"POST",headers:{"x-ui-token":TOKEN,"content-type":"application/json"},body:b===undefined?undefined:JSON.stringify(b)});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||r.status);return j}
function i18n(){document.documentElement.lang=L;$$("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));$("#lang").value=L}
const outFor=op=>({restore_points:"out_inspect",disk_health:"out_inspect",pending_reboot:"out_inspect",sfc:"out_repair",dism:"out_repair",chkdsk:"out_chkdsk",restore:"out_restore"}[op]);
async function refresh(){const s=await api("/api/status");L=s.language||L;i18n();
 $("#adminWarn").classList.toggle("hidden",s.is_admin);$("#adminWarn").textContent=t("admin");
 $("#bootGuide").innerHTML=(s.bootrec_guide||[]).map(x=>`<li>${esc(x)}</li>`).join("")}
async function doOp(b){const op=b.dataset.op;const box=$("#"+outFor(op));const params={};
 if(op==="chkdsk")params.drive=$("#drive").value;
 if(op==="restore"){const v=$("#rpSel").value;if(!v){alert(t("needc"));return}params.sequence=+v}
 if(b.dataset.confirm){if(!confirm(t(b.dataset.confirm)))return;params.confirm=true}
 b.disabled=true;box.classList.remove("hidden");box.textContent=t("running");
 try{const r=await api("/api/op/"+op,{params});
  if(op==="restore_points"){const rp=(r.data.restore_points||[]);$("#rpSel").innerHTML=rp.map(x=>`<option value="${x.sequence}">#${x.sequence} ${esc(x.description)} ${esc(x.created)}</option>`).join("");
   box.textContent=rp.length?rp.map(x=>`#${x.sequence} ${x.description} (${x.created})`).join("\n"):t("none")}
  else box.textContent=(r.ok?"✓ "+t("done"):"✗ "+t("fail"))+(r.error?" ("+r.error+")":"")+"\n\n"+(r.output||JSON.stringify(r.data));
 }catch(e){box.textContent=e.message}b.disabled=false}
$$("[data-op]").forEach(b=>b.onclick=()=>doOp(b));
$("#lang").onchange=e=>{L=e.target.value;i18n()};
$("#quit").onclick=async()=>{try{await api("/api/quit",{})}catch(e){}document.querySelector("main").innerHTML=`<div class="card">${t("done")}</div>`};
i18n();refresh().catch(e=>$("#adminWarn").classList.remove("hidden"));
</script></body></html>
