<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BONELİA AI Monitor</title>
<style>
:root{--bg:#f4f6f9;--panel:#fff;--ink:#132030;--muted:#5a6b7d;--line:#dde3ea;--brand:#0b5cad;--brand2:#0a7f6f;
--crit:#b00020;--err:#d9480f;--warn:#b98900;--ok:#1b7f3a;--chip:#eef2f6}
@media (prefers-color-scheme:dark){:root{--bg:#0e141b;--panel:#151d26;--ink:#e6edf3;--muted:#93a4b5;--line:#253241;--brand:#4ea1ff;
--brand2:#3cc7b2;--chip:#1d2834}}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:.5px;font-size:18px}.logo span{color:var(--brand)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--muted)}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--crit)}
nav{display:flex;gap:4px;margin-left:auto}nav button{background:none;border:0;color:var(--muted);padding:8px 12px;border-radius:6px;cursor:pointer;font:inherit}
nav button.active{background:var(--chip);color:var(--ink);font-weight:600}
main{max-width:1100px;margin:20px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h3{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.big{font-size:22px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
button.primary,button.sec{border:0;border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer}
button.primary{background:var(--brand);color:#fff}button.sec{background:var(--chip);color:var(--ink)}
button:disabled{opacity:.5;cursor:wait}
input[type=text],input[type=password],textarea,select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit}
textarea{width:100%;min-height:70px}
.f{border-left:5px solid var(--muted);margin:10px 0}.f.critical{border-left-color:var(--crit)}.f.error{border-left-color:var(--err)}.f.warning{border-left-color:var(--warn)}
.f h4{margin:0 0 4px}.meta{color:var(--muted);font-size:12px}
.ev{font-size:12px;background:var(--chip);border-radius:6px;padding:6px 8px;margin:6px 0;word-break:break-word}
.conf{font-size:11px;padding:1px 6px;border-radius:10px;background:var(--chip);margin-right:6px}
.warn{color:var(--warn)}.notice{background:var(--chip);border-radius:8px;padding:10px 12px;margin:8px 0}
.hidden{display:none}.lvl{font-weight:700}.lvl0{color:var(--ok)}.lvl1{color:var(--brand2)}.lvl2{color:var(--warn)}.lvl3{color:var(--crit)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.chat{white-space:pre-wrap}.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="logo">BONELİA <span>AI</span></div>
  <div class="small" id="srv"><span class="dot"></span><span id="srvtxt">…</span></div>
  <nav id="nav">
    <button data-p="home" class="active" data-i="nav_home"></button>
    <button data-p="scan" data-i="nav_scan"></button>
    <button data-p="chat" data-i="nav_chat"></button>
    <button data-p="fix" data-i="nav_fix"></button>
    <button data-p="report" data-i="nav_report"></button>
  </nav>
  <select id="lang"><option value="tr">TR</option><option value="de">DE</option><option value="en">EN</option></select>
</header>
<main>
  <section id="unlock" class="card hidden">
    <h3 data-i="unlock_title"></h3>
    <div class="row"><input type="password" id="pass" autocomplete="off"><button class="primary" id="btnUnlock" data-i="unlock"></button></div>
    <div class="small" data-i="unlock_hint"></div>
  </section>

  <section id="p-home">
    <div class="grid">
      <div class="card"><h3 data-i="server"></h3><div class="big" id="kServer">–</div><div class="small" id="kServerSub"></div></div>
      <div class="card"><h3 data-i="ai_model"></h3><div class="big" id="kAI">–</div></div>
      <div class="card"><h3 data-i="customer"></h3><div class="big" id="kTenant">–</div><div class="small" id="kDevice"></div></div>
      <div class="card"><h3 data-i="computer"></h3><div class="big" id="kHost">–</div><div class="small" id="kOS"></div></div>
      <div class="card"><h3 data-i="apps"></h3><div class="big" id="kApps">0</div></div>
      <div class="card"><h3 data-i="active_errors"></h3><div class="big" id="kErr">0</div></div>
      <div class="card"><h3 data-i="monitoring"></h3><div class="big" data-i="mon_session"></div></div>
    </div>
    <div class="card" style="margin-top:12px"><h3 data-i="last_analyses"></h3><div id="homeFindings" class="small" data-i="none_yet"></div></div>
  </section>

  <section id="p-scan" class="hidden">
    <div class="card">
      <h3 data-i="scan_title"></h3>
      <div class="row">
        <button class="primary" data-mode="quick" data-i="m_quick"></button>
        <button class="sec" data-mode="full" data-i="m_full"></button>
        <button class="sec" data-mode="recent" data-i="m_recent"></button>
        <button class="sec" data-mode="app" data-i="m_app"></button>
        <input type="text" id="appq" data-ph="app_ph">
      </div>
      <div class="row">
        <label><input type="checkbox" id="useAI" checked> <span data-i="use_ai"></span></label>
        <label><input type="checkbox" id="cloud"> <span data-i="allow_cloud"></span></label>
        <button class="sec" id="btnVK" data-i="vk"></button>
      </div>
      <div class="small" data-i="readonly_note"></div>
    </div>
    <div id="notices"></div>
    <div id="findings"></div>
  </section>

  <section id="p-chat" class="hidden">
    <div class="card">
      <h3 data-i="chat_title"></h3>
      <textarea id="q" data-ph="chat_ph"></textarea>
      <div class="row"><button class="primary" id="btnAsk" data-i="ask"></button><span class="small" data-i="chat_note"></span></div>
      <div id="answer" class="chat"></div>
    </div>
  </section>

  <section id="p-fix" class="hidden">
    <div class="card">
      <h3 data-i="fix_title"></h3>
      <div class="small" data-i="fix_note"></div>
      <table><thead><tr><th data-i="tool"></th><th data-i="risk"></th><th data-i="state"></th><th></th></tr></thead><tbody id="tools"></tbody></table>
      <div id="fixres" class="notice hidden"></div>
    </div>
  </section>

  <section id="p-report" class="hidden">
    <div class="card">
      <h3 data-i="report_title"></h3>
      <div class="row"><button class="primary" id="btnOpenRep" data-i="open_report"></button></div>
      <div class="row"><input type="text" id="dest" style="min-width:320px" data-ph="dest_ph"><button class="sec" id="btnExport" data-i="export"></button></div>
      <div id="expres" class="small"></div>
      <div class="small" data-i="report_note"></div>
    </div>
  </section>
</main>
<script>
const T={
tr:{nav_home:"Ana ekran",nav_scan:"Tarama",nav_chat:"AI Sohbet",nav_fix:"Müdahale",nav_report:"Rapor",server:"Sunucu bağlantısı",ai_model:"AI modeli",
customer:"Seçili müşteri",computer:"Bilgisayar",apps:"Tespit edilen uygulamalar",active_errors:"Aktif hata",monitoring:"İzleme durumu",mon_session:"Oturum boyunca",
last_analyses:"Son analizler",none_yet:"Henüz tarama yapılmadı.",scan_title:"Teşhis türünü seçin",m_quick:"Hızlı teşhis",m_full:"Tam teşhis (7 gün)",
m_recent:"Son hatalar (1 saat)",m_app:"Belirli uygulamayı incele",app_ph:"Uygulama adı",use_ai:"Merkezi AI ile analiz et",allow_cloud:"Müşteri bulut AI'ye izin veriyor",
vk:"VeedelKorb sağlık analizi",readonly_note:"Bu sürüm salt okunurdur: hiçbir kayıt veya ayar değiştirilmez.",chat_title:"Doğal dilde soru sorun",
chat_ph:"Örn: Son yarım saatteki hataları incele.",ask:"Sor",chat_note:"Yanıtlar kayıtlı teknik kanıtlara dayanır; komut çalıştırılmaz.",
fix_title:"Kontrollü müdahale",fix_note:"Tüm araçlar politika motorundan geçer. v0.1'de yalnızca deneme (dry-run) yapılabilir; gerçek müdahale yönetici onayı ve test ortamı gerektirir.",
tool:"Araç",risk:"Risk seviyesi",state:"Durum",report_title:"Teknik servis raporu",open_report:"Raporu aç / yazdır (PDF)",export:"Dışa aktar (JSON, TXT, HTML)",
dest_ph:"Hedef klasör (USB dışında), örn. C:\\Users\\Public\\Desktop",report_note:"USB üzerindeki raporlar yalnızca şifreli saklanır.",
unlock_title:"USB kilidini aç",unlock:"Kilidi aç",unlock_hint:"Kayıt sırasında belirlenen USB parolası.",connected:"Bağlı",offline:"Bağlantı yok",
not_enrolled:"Kayıtsız USB (yalnız yerel)",locked:"Kilitli",cause:"Muhtemel neden",rec:"Öneri",missing:"Eksik bilgi",dry:"Dene (dry-run)",enabled:"Etkin",disabled:"Kapalı",
nofind:"İncelenen kaynaklarda hata bulunmadı.",working:"Çalışıyor…",rules:"Kural motoru",lvl:["0 Okuma","1 Güvenli otomatik","2 Yönetici onaylı","3 Kritik (engelli)"]},
de:{nav_home:"Übersicht",nav_scan:"Scan",nav_chat:"KI-Chat",nav_fix:"Eingriff",nav_report:"Bericht",server:"Serververbindung",ai_model:"KI-Modell",
customer:"Kunde",computer:"Computer",apps:"Erkannte Anwendungen",active_errors:"Aktive Fehler",monitoring:"Überwachung",mon_session:"Während der Sitzung",
last_analyses:"Letzte Analysen",none_yet:"Noch kein Scan durchgeführt.",scan_title:"Diagnoseart wählen",m_quick:"Schnelldiagnose",m_full:"Volldiagnose (7 Tage)",
m_recent:"Letzte Fehler (1 Std.)",m_app:"Bestimmte Anwendung prüfen",app_ph:"Anwendungsname",use_ai:"Mit zentraler KI analysieren",allow_cloud:"Kunde erlaubt Cloud-KI",
vk:"VeedelKorb-Gesundheitsanalyse",readonly_note:"Diese Version arbeitet nur lesend: keine Daten oder Einstellungen werden verändert.",chat_title:"Frage in natürlicher Sprache",
chat_ph:"z. B.: Prüfe die Fehler der letzten halben Stunde.",ask:"Fragen",chat_note:"Antworten basieren auf erfassten technischen Nachweisen; es werden keine Befehle ausgeführt.",
fix_title:"Kontrollierter Eingriff",fix_note:"Alle Werkzeuge laufen über die Richtlinien-Engine. In v0.1 nur Probelauf (Dry-Run); echte Eingriffe brauchen Admin-Freigabe und Testumgebung.",
tool:"Werkzeug",risk:"Risikostufe",state:"Status",report_title:"Technischer Servicebericht",open_report:"Bericht öffnen / drucken (PDF)",export:"Exportieren (JSON, TXT, HTML)",
dest_ph:"Zielordner (außerhalb des USB-Sticks)",report_note:"Berichte auf dem USB-Stick werden nur verschlüsselt gespeichert.",
unlock_title:"USB entsperren",unlock:"Entsperren",unlock_hint:"Das bei der Registrierung festgelegte USB-Passwort.",connected:"Verbunden",offline:"Keine Verbindung",
not_enrolled:"Nicht registriert (nur lokal)",locked:"Gesperrt",cause:"Wahrscheinliche Ursache",rec:"Empfehlung",missing:"Fehlende Angaben",dry:"Probelauf",enabled:"Aktiv",disabled:"Aus",
nofind:"Keine Fehler in den geprüften Quellen.",working:"Läuft…",rules:"Regel-Engine",lvl:["0 Lesen","1 Sicher automatisch","2 Admin-Freigabe","3 Kritisch (gesperrt)"]},
en:{nav_home:"Home",nav_scan:"Scan",nav_chat:"AI Chat",nav_fix:"Intervention",nav_report:"Report",server:"Server connection",ai_model:"AI model",
customer:"Customer",computer:"Computer",apps:"Detected applications",active_errors:"Active errors",monitoring:"Monitoring",mon_session:"During session",
last_analyses:"Latest analyses",none_yet:"No scan yet.",scan_title:"Choose diagnosis type",m_quick:"Quick diagnosis",m_full:"Full diagnosis (7 days)",
m_recent:"Recent errors (1 hour)",m_app:"Inspect a specific app",app_ph:"Application name",use_ai:"Analyse with central AI",allow_cloud:"Customer allows cloud AI",
vk:"VeedelKorb health analysis",readonly_note:"This version is read-only: no records or settings are changed.",chat_title:"Ask in natural language",
chat_ph:"e.g. Inspect the errors of the last half hour.",ask:"Ask",chat_note:"Answers are grounded on recorded technical evidence; no commands are run.",
fix_title:"Controlled intervention",fix_note:"All tools pass the policy engine. v0.1 allows dry-runs only; real interventions need admin approval and a test environment.",
tool:"Tool",risk:"Risk level",state:"State",report_title:"Technical service report",open_report:"Open / print report (PDF)",export:"Export (JSON, TXT, HTML)",
dest_ph:"Destination folder (outside the USB)",report_note:"Reports on the USB are stored encrypted only.",
unlock_title:"Unlock USB",unlock:"Unlock",unlock_hint:"The USB passphrase chosen during enrollment.",connected:"Connected",offline:"Not connected",
not_enrolled:"Not enrolled (local only)",locked:"Locked",cause:"Likely cause",rec:"Recommendation",missing:"Missing information",dry:"Dry-run",enabled:"Enabled",disabled:"Off",
nofind:"No errors found in the inspected sources.",working:"Working…",rules:"Rule engine",lvl:["0 Read","1 Safe auto","2 Admin approved","3 Critical (blocked)"]}};
let TOKEN=location.hash.slice(1);try{if(TOKEN)sessionStorage.setItem("bt",TOKEN);else TOKEN=sessionStorage.getItem("bt")||""}catch(e){}
let L="tr";let lastReport=null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const t=k=>(T[L]||T.en)[k]??k;
async function api(path,body){const r=await fetch(path,{method:body===undefined?"GET":"POST",headers:{"x-ui-token":TOKEN,"content-type":"application/json"},body:body===undefined?undefined:JSON.stringify(body)});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||r.status);return j}
function i18n(){document.documentElement.lang=L;$$("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));$$("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));$("#lang").value=L}
function show(p){$$("main>section[id^=p-]").forEach(s=>s.classList.toggle("hidden",s.id!=="p-"+p));$$("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.p===p));if(p==="fix")loadTools()}
async function refresh(){const s=await api("/api/status");L=s.language||L;i18n();
 $("#unlock").classList.toggle("hidden",!(s.enrolled&&!s.unlocked));
 const c=s.server&&s.server.connected;$("#srv .dot").className="dot "+(c?"ok":"bad");
 $("#srvtxt").textContent=!s.enrolled?t("not_enrolled"):!s.unlocked?t("locked"):c?t("connected")+" · v"+s.server.version:t("offline");
 $("#kServer").textContent=c?t("connected"):t("offline");$("#kServerSub").textContent=s.server&&s.server.reason||"";
 const ai=c&&s.server.ai&&s.server.ai.local;$("#kAI").textContent=ai?(ai.model+(ai.available?" ✓":" ✗")):t("rules");
 $("#kTenant").textContent=s.tenant_id?s.tenant_id.slice(0,14)+"…":"–";$("#kDevice").textContent=s.device_id||"";
 $("#kHost").textContent=s.system?s.system.hostname_ref:"–";$("#kOS").textContent=s.system?(s.system.os+" "+s.system.os_version):"";
 $("#kApps").textContent=s.apps_detected;$("#kErr").textContent=s.active_errors}
function renderReport(rep){lastReport=rep;$("#notices").innerHTML=(rep.notices||[]).map(n=>`<div class="notice">${esc(n)}</div>`).join("");
 const fs=rep.findings||[];const html=fs.length?fs.map(f=>`<div class="card f ${esc(f.severity)}"><h4>${esc(f.title)}</h4>
 <div class="meta">${esc(f.program)} ${esc(f.program_version||"")} · ×${f.occurrences} · ${esc(f.analysis_source)} · ${esc(f.occurred_at)}</div>
 ${(f.evidence||[]).slice(0,1).map(e=>`<div class="ev"><b>${esc(e.source)} ${esc(e.code||"")}</b> ${esc((e.text||"").slice(0,300))}</div>`).join("")}
 ${(f.likely_causes||[]).map(c=>`<div><span class="conf">${esc(c.confidence)}</span>${esc(c.cause)}</div>`).join("")}
 ${(f.recommendations||[]).map(r=>`<div class="small">→ ${esc(r)}</div>`).join("")}
 ${(f.missing_information||[]).length?`<div class="small">${t("missing")}: ${esc(f.missing_information.join("; "))}</div>`:""}
 ${(f.warnings||[]).map(w=>`<div class="warn small">⚠ ${esc(w)}</div>`).join("")}</div>`).join(""):`<div class="card">${t("nofind")}</div>`;
 $("#findings").innerHTML=html;$("#homeFindings").innerHTML=fs.slice(0,5).map(f=>`<div>• [${esc(f.severity)}] ${esc(f.title)} (${esc(f.program)})</div>`).join("")||t("nofind")}
function busy(on){$$("button").forEach(b=>b.disabled=on)}
$$("[data-mode]").forEach(b=>b.onclick=async()=>{busy(true);$("#findings").innerHTML=`<div class="card">${t("working")}</div>`;
 try{const r=await api("/api/scan",{mode:b.dataset.mode,app:$("#appq").value||null,analyze:$("#useAI").checked,allow_cloud:$("#cloud").checked});renderReport(r.report)}
 catch(e){$("#findings").innerHTML=`<div class="notice">${esc(e.message)}</div>`}busy(false);refresh()});
$("#btnVK").onclick=async()=>{busy(true);try{const r=await api("/api/veedelkorb");
 const fake={notices:r.notices,findings:r.events.map((e,i)=>({title:e.title,severity:e.severity,program:"VeedelKorb",program_version:"",occurrences:e.occurrences,
 analysis_source:(r.diagnoses[i]||{}).produced_by,occurred_at:e.occurred_at,evidence:e.evidence,likely_causes:(r.diagnoses[i]||{hypotheses:[]}).hypotheses,
 recommendations:((r.diagnoses[i]||{recommendations:[]}).recommendations).map(x=>x.description),missing_information:[],warnings:(r.diagnoses[i]||{}).warnings||[]}))};
 renderReport(fake)}catch(e){$("#findings").innerHTML=`<div class="notice">${esc(e.message)}</div>`}busy(false)};
$("#btnAsk").onclick=async()=>{busy(true);$("#answer").textContent=t("working");try{const r=await api("/api/chat",{question:$("#q").value});
 $("#answer").textContent=r.answer+"\n\n["+r.produced_by+", "+r.grounded_on+"]"}catch(e){$("#answer").textContent=e.message}busy(false)};
async function loadTools(){const r=await api("/api/tools");$("#tools").innerHTML=r.tools.map(x=>`<tr><td><b>${esc(x.tool_id)}</b><div class="small">${esc(x.description)}</div></td>
 <td class="lvl lvl${x.risk_level}">${esc(t("lvl")[x.risk_level])}</td><td>${x.enabled?t("enabled"):t("disabled")}</td>
 <td>${x.supports_dry_run?`<button class="sec" data-tool="${esc(x.tool_id)}">${t("dry")}</button>`:""}</td></tr>`).join("");
 $$("[data-tool]").forEach(b=>b.onclick=async()=>{const box=$("#fixres");box.classList.remove("hidden");try{const res=await api("/api/tools/"+encodeURIComponent(b.dataset.tool)+"/dry-run",{});
 box.textContent=JSON.stringify(res,null,2)}catch(e){box.textContent=e.message}})}
$("#btnOpenRep").onclick=async()=>{const r=await fetch("/api/report.html",{headers:{"x-ui-token":TOKEN}});if(!r.ok)return;const w=window.open("","_blank");w.document.write(await r.text());w.document.close()};
$("#btnExport").onclick=async()=>{try{const r=await api("/api/export",{dest:$("#dest").value});$("#expres").textContent=r.files.join(", ")}catch(e){$("#expres").textContent=e.message}};
$("#btnUnlock").onclick=async()=>{try{await api("/api/unlock",{passphrase:$("#pass").value});$("#pass").value="";refresh()}catch(e){alert(e.message)}};
$("#lang").onchange=async e=>{L=e.target.value;await api("/api/language",{language:L});i18n()};
$$("#nav button").forEach(b=>b.onclick=()=>show(b.dataset.p));
history.replaceState(null,"",location.pathname);i18n();refresh();setInterval(refresh,30000);
</script>
</body>
</html>
