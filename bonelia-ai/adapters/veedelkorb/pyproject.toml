[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bonelia-adapter-veedelkorb"
version = "0.1.0"
description = "Optional, read-only VeedelKorb adapter for the BONELİA AI Server"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = ["bonelia-ai>=0.1.0", "httpx>=0.27"]

[project.entry-points."bonelia.adapters"]
veedelkorb = "bonelia_adapter_veedelkorb:PLUGIN"

[tool.setuptools.packages.find]
where = ["src"]
