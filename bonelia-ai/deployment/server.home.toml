# Ready-to-use home server configuration (Windows, local AI only, loopback).
# Start: bonelia-server --config deployment\server.home.toml serve
[server]
data_dir = "C:/BoneliaAI/server-data"
host = "127.0.0.1"
port = 8742

[ai]
ollama_url = "http://127.0.0.1:11434"
ollama_model = "qwen2.5:3b-instruct"
# CPU-only PCs: keep this small so one analysis stays within a few minutes
max_ai_events_per_request = 3

[repair]
enabled_tools = []

[notify]
# Windows notification on this PC for important problems, repairs and silent computers
windows_toast = true
# Optional: Telegram to your phone. Put the bot token in the environment variable
# BONELIA_TELEGRAM_BOT_TOKEN and your chat id here.
# telegram_chat_id = "123456789"
language = "tr"
