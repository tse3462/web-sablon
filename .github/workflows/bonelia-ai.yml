name: BONELIA AI

on:
  push:
    paths: ["bonelia-ai/**", ".github/workflows/bonelia-ai.yml"]
  pull_request:
    paths: ["bonelia-ai/**", ".github/workflows/bonelia-ai.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: bonelia-ai

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 1) Pure core: NO application adapter installed. Proves BONELİA AI works when every
      #    optional adapter (e.g. VeedelKorb) is removed.
      - name: Install core only
        run: pip install -e ".[dev]"
      - name: Core tests without any adapter package
        run: |
          python -c "from importlib.metadata import entry_points; eps=list(entry_points(group='bonelia.adapters')); assert not eps, eps"
          python -m pytest -q -rs tests
      # 2) Optional adapter installed alongside the core.
      - name: Install optional VeedelKorb adapter
        run: pip install -e adapters/veedelkorb --no-deps
      - name: Core + adapter tests
        run: python -m pytest -q -rs tests adapters/veedelkorb/tests
      # 3) Adapter uninstalled again: core must still pass.
      - name: Uninstall adapter and re-test core
        run: |
          pip uninstall -y bonelia-adapter-veedelkorb
          python -m pytest -q tests/integration/test_modularity.py tests/integration/test_cli_e2e.py

  windows-server-py314:
    # The home AI server may run on a newer Python than the build (owner's PC has 3.14).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e ".[server]" pytest
      - name: Server + client tests on Windows with Python 3.14
        run: python -m pytest -q -rs tests
      - name: Double-click server scripts (start hidden, health, stop, autostart on/off)
        shell: pwsh
        run: |
          cmd /c deployment\windows\BONELIA-Server-Baslat.bat
          if ($LASTEXITCODE -ne 0) { Get-Content C:\BoneliaAI\server.log -ErrorAction SilentlyContinue; throw "start script failed" }
          $h = Invoke-RestMethod http://127.0.0.1:8742/v1/health
          if ($h.status -ne "ok") { throw "health not ok" }
          cmd /c deployment\windows\BONELIA-Server-Baslat.bat   # second start must detect the running server
          cmd /c deployment\windows\BONELIA-Server-Durdur.bat
          Start-Sleep -Seconds 2
          $alive = $true
          try { Invoke-RestMethod http://127.0.0.1:8742/v1/health -TimeoutSec 3 | Out-Null } catch { $alive = $false }
          if ($alive) { throw "server still running after stop script" }
          $f = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\BONELIA-AI-Server.bat"
          cmd /c deployment\windows\Otomatik-Baslatma-AC.bat
          if (-not (Test-Path $f)) { throw "autostart entry not created" }
          Get-Content $f
          cmd /c deployment\windows\Otomatik-Baslatma-KAPAT.bat
          if (Test-Path $f) { throw "autostart entry not removed" }
          # Combined launcher: server + phone panel, and the all-in-one autostart entry
          cmd /c deployment\windows\BONELIA-Baslat.bat
          Start-Sleep -Seconds 2
          if ((Invoke-RestMethod http://127.0.0.1:8742/v1/health).status -ne "ok") { throw "server not up after BONELIA-Baslat" }
          $ok = $false
          for ($i = 0; $i -lt 20 -and -not $ok; $i++) { Start-Sleep -Milliseconds 500; try { $ok = (Invoke-WebRequest http://127.0.0.1:8750/ -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200 } catch {} }
          if (-not $ok) { throw "panel not up after BONELIA-Baslat" }
          cmd /c deployment\windows\BONELIA-Kur-Otomatik.bat
          schtasks /Query /TN "BONELIA AI" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "hidden autostart task not created" }
          schtasks /Delete /F /TN "BONELIA AI" | Out-Null
          cmd /c deployment\windows\BONELIA-Server-Durdur.bat
          # Update every installed PC from home: publish the agent from the USB package (here: a stand-in file)
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\usb" | Out-Null
          Set-Content "$env:RUNNER_TEMP\usb\BoneliaAI-Konsol.exe" "stand-in agent"
          $env:CI = "1"
          cmd /c deployment\windows\BONELIA-Ajanlari-Guncelle.bat "$env:RUNNER_TEMP\usb\BoneliaAI-Konsol.exe"
          if ($LASTEXITCODE -ne 0) { throw "agent publish script failed" }
          $m = Get-Content C:\BoneliaAI\server-data\agent_update\manifest.json | ConvertFrom-Json
          if (-not $m.signature) { throw "agent update not signed" }
          cmd /c deployment\windows\BONELIA-Ajanlari-Guncelle.bat "$env:RUNNER_TEMP\usb\yok.exe"
          if ($LASTEXITCODE -eq 0) { throw "missing agent file must fail" }
          $global:LASTEXITCODE = 0   # that failure was expected; do not let it end the step as failed
      - name: Backup before a format and the one-click restore afterwards
        shell: pwsh
        run: |
          $d = "$env:RUNNER_TEMP\srv"; New-Item -ItemType Directory -Force $d | Out-Null
          python -c "import sys; from bonelia.server.store import Store; Store(sys.argv[1]).create_tenant('BONELIA')" "$d\bonelia.db"
          Set-Content "$d\server_ed25519.key" "KEY-ORIGINAL"; Set-Content "$d\dashboard.token" "tok"
          Set-Content "$env:RUNNER_TEMP\srv.toml" ("[server]`ndata_dir = `"" + ($d -replace '\\', '/') + "`"`n")
          $env:CI = "1"; $env:BONELIA_PY = (Get-Command python).Source; $env:BONELIA_CONFIG = "$env:RUNNER_TEMP\srv.toml"
          $usb = "$env:RUNNER_TEMP\usb2\BONELIA-Yedek"; $env:BONELIA_BACKUP_DEST = $usb
          cmd /c deployment\windows\BONELIA-Yedekle.bat
          if ($LASTEXITCODE -ne 0) { throw "backup failed" }
          if (-not (Test-Path "$usb\BONELIA-Format-Sonrasi-Kur.bat")) { throw "restore script not put next to the backup" }
          $env:BONELIA_ONLY_DATA = "1"; $env:BONELIA_DATA_DIR = "$env:RUNNER_TEMP\restored"
          cmd /c "$usb\BONELIA-Format-Sonrasi-Kur.bat"
          if ($LASTEXITCODE -ne 0) { throw "restore failed" }
          if ((Get-Content "$env:RUNNER_TEMP\restored\server_ed25519.key") -ne "KEY-ORIGINAL") { throw "server key not restored" }
          if (-not (Test-Path "$env:RUNNER_TEMP\restored\bonelia.db")) { throw "database not restored" }
          $b = Get-ChildItem -Directory $usb -Filter 'sunucu-*' | Select-Object -First 1
          Set-Content "$($b.FullName)\data\dashboard.token" "changed"
          cmd /c "$usb\BONELIA-Format-Sonrasi-Kur.bat"
          if ($LASTEXITCODE -eq 0) { throw "a damaged backup must be refused" }
          $global:LASTEXITCODE = 0   # that failure was expected
      - name: USB preparation script (real downloads, signature and SHA-256 checks)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $u = "$env:RUNNER_TEMP\usbprep\BONELIA-AI-Portable"
          New-Item -ItemType Directory -Force $u | Out-Null
          Set-Content "$u\Bu-Bilgisayara-Kur.bat" "stand-in"
          $env:BONELIA_USB = $u; $env:BONELIA_TS_KEY = "tskey-auth-kTEST123-abcDEF"; $env:CI = "1"
          cmd /c deployment\windows\BONELIA-USB-Hazirla.bat
          if ($LASTEXITCODE -ne 0) { throw "USB preparation failed" }
          $ts = Get-ChildItem "$u\tailscale\*.msi"; $rd = Get-ChildItem "$u\rustdesk\*.msi"
          if (-not $ts) { throw "no Tailscale MSI" }; if (-not $rd) { throw "no RustDesk MSI" }
          $ts.Name; $rd.Name; (Get-AuthenticodeSignature $ts.FullName).SignerCertificate.Subject
          if ([IO.File]::ReadAllText("$u\config\tailscale-authkey.txt") -ne "tskey-auth-kTEST123-abcDEF") { throw "key file wrong" }
          # A second run keeps what is there and does not download again.
          $env:BONELIA_TS_KEY = ""
          cmd /c deployment\windows\BONELIA-USB-Hazirla.bat
          if ($LASTEXITCODE -ne 0) { throw "second run failed" }

  windows:
    # Real Windows verification: event log access, controlled error via eventcreate,
    # frozen BoneliaAI.exe smoke test. A Linux build is never accepted as proof for Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"   # the USB monitor never ships application adapters
      - name: Tests (including Windows-only tests)
        run: python -m pytest -q -rs tests
      - name: Build portable package
        run: python scripts/build_portable.py --out dist
      - name: Smoke test BoneliaAI.exe on Windows
        shell: pwsh
        run: |
          $pkg = "dist/BONELIA-AI-Portable"
          & "$pkg/BoneliaAI-Konsol.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "version failed" }
          eventcreate /T ERROR /ID 997 /L APPLICATION /SO BoneliaAISmoke /D "BONELIA AI frozen exe smoke test error"
          $json = & "$pkg/BoneliaAI-Konsol.exe" --lang tr scan --no-unlock --mode recent --json | Out-String
          if ($LASTEXITCODE -ne 0) { throw "scan failed" }
          $rep = $json | ConvertFrom-Json
          $rep.checks_performed | Format-List
          if (-not $rep.checks_performed.'eventlog:Application'.StartsWith("ok:")) { throw "event log not readable" }
          if (-not $rep.checks_performed.installed_apps.StartsWith("ok:")) { throw "installed apps not readable" }
          $hit = $rep.findings | Where-Object { $_.evidence[0].code -like "BoneliaAISmoke/997" }
          if (-not $hit) { throw "controlled error not detected by frozen exe" }
          Write-Host "Detected:" $hit.title
          if (Get-ChildItem "$pkg/reports" -File) { throw "unenrolled scan must not write plaintext reports to the USB" }
          # Double-click build: no console window, must still serve the UI
          $p = Start-Process -FilePath "$pkg/BoneliaAI.exe" -ArgumentList "ui","--no-browser","--port","18800" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) {
            Start-Sleep -Milliseconds 500
            try { $ok = (Invoke-WebRequest http://127.0.0.1:18800/ -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200 } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "windowed BoneliaAI.exe did not serve the UI" }
          Write-Host "Windowed BoneliaAI.exe served the UI"
          foreach ($f in "Bu-Bilgisayara-Kur.bat", "Bu-Bilgisayardan-Kaldir.bat", "BoneliaAI-Konsol.exe") {
            if (-not (Test-Path "$pkg/$f")) { throw "missing in package: $f" }
          }
          & "$pkg/BoneliaAI-Konsol.exe" agent-status
      - uses: actions/upload-artifact@v4
        with:
          name: BONELIA-AI-Portable-windows
          path: bonelia-ai/dist/BONELIA-AI-Portable
          retention-days: 14
